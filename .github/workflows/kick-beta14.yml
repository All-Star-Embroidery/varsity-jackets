name: Kick beta.14 publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Dispatch beta.14 publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-beta14.yml --ref main

      - name: Remove one-time scheduler
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/kick-beta14.yml
          git commit -m 'chore: remove beta.14 scheduler [skip ci]'
          git push origin HEAD:main
