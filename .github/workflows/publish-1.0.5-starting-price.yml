name: Publish 1.0.5 Starting Price Clarification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.5-starting-price.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply v1.0.5 pricing-language update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('all-star-varsity-jackets')

          main = root / 'all-star-varsity-jackets.php'
          text = main.read_text(encoding='utf-8')
          text = text.replace(' * Version: 1.0.4', ' * Version: 1.0.5')
          text = text.replace("define( 'ASEVJ_VERSION', '1.0.4' );", "define( 'ASEVJ_VERSION', '1.0.5' );")
          main.write_text(text, encoding='utf-8')

          for block_json in (root / 'blocks').glob('*/block.json'):
              data = json.loads(block_json.read_text(encoding='utf-8'))
              data['version'] = '1.0.5'
              block_json.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          js = root / 'assets/frontend.js'
          text = js.read_text(encoding='utf-8')
          old = """        if (style.priceHtml) {\n            var price = document.createElement('div');\n            price.className = 'asevj-modal__price';\n            price.innerHTML = style.priceHtml;\n            details.appendChild(price);\n\n            stickyPrice.innerHTML = '<small>STARTING AT</small><strong>' + style.priceHtml + '</strong>';\n        }\n"""
          new = """        if (style.priceHtml) {\n            var price = document.createElement('div');\n            price.className = 'asevj-modal__price';\n            price.appendChild(text('small', 'STARTING AT'));\n            var modalPriceValue = document.createElement('strong');\n            modalPriceValue.innerHTML = style.priceHtml;\n            price.appendChild(modalPriceValue);\n            details.appendChild(price);\n\n            stickyPrice.innerHTML = '<small>STARTING AT</small><strong>' + style.priceHtml + '</strong>';\n        }\n"""
          if old not in text:
              raise SystemExit('Expected modal price block was not found; refusing a partial release.')
          text = text.replace(old, new, 1)
          js.write_text(text, encoding='utf-8')

          css = root / 'assets/frontend.css'
          text = css.read_text(encoding='utf-8')
          marker = '/* v1.0.5 — clarify base prices as starting prices */'
          if marker not in text:
              text += '''\n\n/* v1.0.5 — clarify base prices as starting prices */\n.asevj-modal__price{\n    display:flex;\n    flex-direction:column;\n    align-items:flex-start;\n    gap:3px;\n}\n.asevj-modal__price small{\n    display:block;\n    font-size:9px;\n    line-height:1.1;\n    font-weight:900;\n    letter-spacing:.09em;\n    text-transform:uppercase;\n    color:var(--asevj-muted);\n}\n.asevj-modal__price strong{\n    display:block;\n    font:inherit;\n    color:inherit;\n}\n'''
          css.write_text(text, encoding='utf-8')

          readme = root / 'readme.txt'
          text = readme.read_text(encoding='utf-8')
          import re
          text = re.sub(r'Stable tag:\s*[^\n]+', 'Stable tag: 1.0.5', text)
          if '= 1.0.5 =' not in text:
              text += '''\n\n= 1.0.5 =\n* Clarified all Varsity Jackets module prices as Starting at prices.\n* Added Starting at above the jacket-detail popup price to match the selected-style and sticky CTA displays.\n'''
          readme.write_text(text, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          if not text.startswith('## 1.0.5'):
              text = '''## 1.0.5\n\n- Clarified customer-facing Varsity Jackets prices as **Starting at** prices because customization may increase the final total.\n- Added the missing **Starting at** label above the jacket-detail popup price.\n- Kept the existing Starting at treatment in style cards, selected-style pricing, and the sticky customization bar.\n- Added responsive modal price-label styling.\n\n''' + text
          changelog.write_text(text, encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          MAIN='all-star-varsity-jackets/all-star-varsity-jackets.php'
          grep -q '^ \* Version: 1.0.5$' "$MAIN"
          grep -q "define( 'ASEVJ_VERSION', '1.0.5' );" "$MAIN"
          grep -q 'Update URI: https://github.com/All-Star-Embroidery/varsity-jackets' "$MAIN"
          grep -q "price.appendChild(text('small', 'STARTING AT'))" all-star-varsity-jackets/assets/frontend.js
          grep -q '<small>STARTING AT</small><strong>' all-star-varsity-jackets/includes/class-asevj-render.php

          while IFS= read -r -d '' file; do php -l "$file"; done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do python3 -m json.tool "$file" >/dev/null; done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-varsity-jackets releases/RELEASE-1.0.5.md
          git commit -m 'release: prepare v1.0.5 starting-price clarification'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build and validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asevj-1.0.5-build all-star-varsity-jackets-1.0.5.zip
          mkdir -p /tmp/asevj-1.0.5-build/all-star-varsity-jackets
          cp -R all-star-varsity-jackets/. /tmp/asevj-1.0.5-build/all-star-varsity-jackets/
          rm -rf /tmp/asevj-1.0.5-build/all-star-varsity-jackets/.git /tmp/asevj-1.0.5-build/all-star-varsity-jackets/.github /tmp/asevj-1.0.5-build/all-star-varsity-jackets/tests /tmp/asevj-1.0.5-build/all-star-varsity-jackets/node_modules
          cd /tmp/asevj-1.0.5-build
          zip -qr "$GITHUB_WORKSPACE/all-star-varsity-jackets-1.0.5.zip" all-star-varsity-jackets
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-varsity-jackets-1.0.5.zip >/dev/null
          zipinfo -1 all-star-varsity-jackets-1.0.5.zip | grep -q '^all-star-varsity-jackets/all-star-varsity-jackets.php$'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.5 >/dev/null 2>&1; then
            gh release upload v1.0.5 all-star-varsity-jackets-1.0.5.zip --clobber
            gh release edit v1.0.5 --title 'All Star Varsity Jackets v1.0.5' --notes-file releases/RELEASE-1.0.5.md --latest
          else
            gh release create v1.0.5 all-star-varsity-jackets-1.0.5.zip --target main --title 'All Star Varsity Jackets v1.0.5' --notes-file releases/RELEASE-1.0.5.md --latest
          fi

      - name: Update WordPress manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          url = 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.5/all-star-varsity-jackets-1.0.5.zip'
          latest = {
              'name': 'All Star Varsity Jackets',
              'slug': 'all-star-varsity-jackets',
              'version': '1.0.5',
              'download_url': url,
              'homepage': 'https://github.com/All-Star-Embroidery/varsity-jackets',
              'requires': '6.4',
              'tested': '6.8',
              'requires_php': '8.0',
              'last_updated': now,
              'description': "All Star Embroidery's WordPress/WooCommerce varsity jacket system with school browsing, multiple jacket styles per school, responsive image galleries, structured ZIP/CSV imports, live Gutenberg blocks, WooCommerce product tools, and organization-owned automatic updates.",
              'changelog': '<h4>1.0.5</h4><ul><li>Clarified customer-facing jacket prices as Starting at prices.</li><li>Added Starting at above the jacket-detail popup price.</li><li>Preserved consistent starting-price language across style cards, selected-style pricing, and sticky customization actions.</li></ul>'
          }
          Path('latest.json').write_text(json.dumps(latest, indent=2) + '\n', encoding='utf-8')
          legacy = {
              'version': '1.0.5',
              'name': 'All Star Varsity Jackets 1.0.5',
              'prerelease': False,
              'package': url,
              'html_url': 'https://github.com/All-Star-Embroidery/varsity-jackets',
              'published_at': now,
              'body': 'Clarifies varsity-jacket base prices as Starting at prices.'
          }
          Path('update.json').write_text(json.dumps(legacy, indent=2) + '\n', encoding='utf-8')
          PY
          git add latest.json update.json
          git commit -m 'release: point WordPress updater to 1.0.5' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify public update channel
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --location --retry 5 --retry-delay 2 'https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?release=105' -o /tmp/latest.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/latest.json'))
          assert data['version'] == '1.0.5', data
          assert data['download_url'] == 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.5/all-star-varsity-jackets-1.0.5.zip', data
          print('Verified:', data['download_url'])
          PY
          curl --fail --location --retry 5 --retry-delay 2 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.5/all-star-varsity-jackets-1.0.5.zip' -o /tmp/asevj-1.0.5.zip
          unzip -t /tmp/asevj-1.0.5.zip >/dev/null

      - name: Remove one-time release workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f .github/workflows/publish-1.0.5-starting-price.yml
          git add -A
          git commit -m 'chore: remove one-time 1.0.5 release workflow' || true
          git push origin HEAD:main
