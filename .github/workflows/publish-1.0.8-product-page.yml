name: Publish 1.0.8 Product Page Block

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.8-product-page.yml'

permissions:
  contents: write

concurrency:
  group: ase-varsity-jackets-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Finalize 1.0.8 source metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('all-star-varsity-jackets')
          for block_json in (root / 'blocks').glob('*/block.json'):
              data = json.loads(block_json.read_text(encoding='utf-8'))
              data['version'] = '1.0.8'
              block_json.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          entry = '''## 1.0.8\n\n- Added the Varsity Jacket Product Page Gutenberg block.\n- Added automatic linked-product detection, gallery, school/style identity, starting-price clarification, jacket details, customization options, and call-to-order CTA.\n- Added extensive product-page layout, content, color, visibility, spacing, image-scale, and responsive controls.\n- Added live Gutenberg preview plus responsive thumbnail gallery behavior.\n\n'''
          existing = changelog.read_text(encoding='utf-8') if changelog.exists() else ''
          if not existing.startswith('## 1.0.8'):
              changelog.write_text(entry + existing, encoding='utf-8')

          readme = root / 'readme.txt'
          if readme.exists():
              rt = readme.read_text(encoding='utf-8')
              rt = re.sub(r'Stable tag:\s*[^\n]+', 'Stable tag: 1.0.8', rt)
              if '= 1.0.8 =' not in rt:
                  rt += '''\n= 1.0.8 =\n* Added a dedicated Varsity Jacket Product Page Gutenberg block.\n* Added clear base-price/customization pricing language and call-to-order CTA.\n* Added responsive product gallery and extensive block customization controls.\n'''
              readme.write_text(rt, encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          MAIN='all-star-varsity-jackets/all-star-varsity-jackets.php'
          grep -q '^ \* Version: 1.0.8$' "$MAIN"
          grep -q "define( 'ASEVJ_VERSION', '1.0.8' );" "$MAIN"
          grep -q "class-asevj-product-page.php" "$MAIN"
          grep -q "'product-page'" all-star-varsity-jackets/includes/class-asevj-blocks.php
          test -f all-star-varsity-jackets/blocks/product-page/block.json
          test -f all-star-varsity-jackets/blocks/product-page/editor.js
          test -f all-star-varsity-jackets/blocks/product-page/style.css
          test -f releases/RELEASE-1.0.8.md
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do python3 -m json.tool "$file" >/dev/null; done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-varsity-jackets
          git commit -m 'release: finalize Varsity Jacket Product Page in 1.0.8' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build and validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asevj-1.0.8-build all-star-varsity-jackets-1.0.8.zip
          mkdir -p /tmp/asevj-1.0.8-build/all-star-varsity-jackets
          cp -R all-star-varsity-jackets/. /tmp/asevj-1.0.8-build/all-star-varsity-jackets/
          rm -rf /tmp/asevj-1.0.8-build/all-star-varsity-jackets/.git /tmp/asevj-1.0.8-build/all-star-varsity-jackets/.github /tmp/asevj-1.0.8-build/all-star-varsity-jackets/tests /tmp/asevj-1.0.8-build/all-star-varsity-jackets/node_modules
          cd /tmp/asevj-1.0.8-build
          zip -qr "$GITHUB_WORKSPACE/all-star-varsity-jackets-1.0.8.zip" all-star-varsity-jackets
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-varsity-jackets-1.0.8.zip >/dev/null
          zipinfo -1 all-star-varsity-jackets-1.0.8.zip | grep -q '^all-star-varsity-jackets/all-star-varsity-jackets.php$'
          zipinfo -1 all-star-varsity-jackets-1.0.8.zip | grep -q '^all-star-varsity-jackets/blocks/product-page/block.json$'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.8 all-star-varsity-jackets-1.0.8.zip \
            --target main \
            --title 'All Star Varsity Jackets v1.0.8' \
            --notes-file releases/RELEASE-1.0.8.md \
            --latest

      - name: Update WordPress manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          url = 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.8/all-star-varsity-jackets-1.0.8.zip'
          homepage = 'https://github.com/All-Star-Embroidery/varsity-jackets'
          latest = {
              'name': 'All Star Varsity Jackets',
              'slug': 'all-star-varsity-jackets',
              'version': '1.0.8',
              'download_url': url,
              'homepage': homepage,
              'requires': '6.4',
              'tested': '6.8',
              'requires_php': '8.0',
              'last_updated': now,
              'description': "All Star Embroidery's WordPress/WooCommerce varsity jacket system with school browsing, multi-style galleries, dedicated jacket product-page blocks, structured imports, and WooCommerce product tools.",
              'changelog': '<h4>1.0.8</h4><ul><li>Added a dedicated Varsity Jacket Product Page Gutenberg block.</li><li>Added clear Starting at / base-price language with customization pricing disclosure.</li><li>Added responsive product gallery, customization showcase, call-to-order CTA, and extensive design controls.</li></ul>'
          }
          Path('latest.json').write_text(json.dumps(latest, indent=2) + '\n', encoding='utf-8')
          legacy = {
              'version': '1.0.8',
              'name': 'All Star Varsity Jackets 1.0.8',
              'prerelease': False,
              'package': url,
              'html_url': homepage,
              'published_at': now,
              'body': 'Adds the dedicated Varsity Jacket Product Page Gutenberg block.'
          }
          Path('update.json').write_text(json.dumps(legacy, indent=2) + '\n', encoding='utf-8')
          PY
          git add latest.json update.json
          git commit -m 'release: point WordPress updater to 1.0.8'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify public update channel
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?run=${GITHUB_RUN_ID}" \
            -o /tmp/latest.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/latest.json'))
          assert data['version'] == '1.0.8', data
          assert data['download_url'].endswith('/v1.0.8/all-star-varsity-jackets-1.0.8.zip'), data
          print('Update channel verified:', data['version'])
          PY
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.8/all-star-varsity-jackets-1.0.8.zip' \
            -o /tmp/asevj-1.0.8.zip
          unzip -t /tmp/asevj-1.0.8.zip >/dev/null

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/publish-1.0.8-product-page.yml
          git commit -m 'chore: remove one-time 1.0.8 publisher'
          git push origin HEAD:main
