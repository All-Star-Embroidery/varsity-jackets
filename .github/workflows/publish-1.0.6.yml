name: Publish 1.0.6
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-1.0.6.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply source update
        run: python3 releases/build-1.0.6.py
      - name: Validate source
        run: |
          set -euo pipefail
          grep -q '^ \* Version: 1.0.6$' all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q 'asevj-customizations--sidebar' all-star-varsity-jackets/includes/class-asevj-render.php
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do python3 -m json.tool "$file" >/dev/null; done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)
      - name: Commit production source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-varsity-jackets
          git commit -m 'release: compact Browse by School in 1.0.6'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Build ZIP
        run: |
          set -euo pipefail
          rm -rf /tmp/asevj106 all-star-varsity-jackets-1.0.6.zip
          mkdir -p /tmp/asevj106/all-star-varsity-jackets
          cp -R all-star-varsity-jackets/. /tmp/asevj106/all-star-varsity-jackets/
          cd /tmp/asevj106
          zip -qr "$GITHUB_WORKSPACE/all-star-varsity-jackets-1.0.6.zip" all-star-varsity-jackets
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-varsity-jackets-1.0.6.zip >/dev/null
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.6 all-star-varsity-jackets-1.0.6.zip --target main --title 'All Star Varsity Jackets v1.0.6' --notes-file releases/RELEASE-1.0.6.md --latest
      - name: Update manifests
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          now=datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          url='https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.6/all-star-varsity-jackets-1.0.6.zip'
          latest={'name':'All Star Varsity Jackets','slug':'all-star-varsity-jackets','version':'1.0.6','download_url':url,'homepage':'https://github.com/All-Star-Embroidery/varsity-jackets','requires':'6.4','tested':'6.8','requires_php':'8.0','last_updated':now,'description':"All Star Embroidery's WordPress/WooCommerce varsity jacket system with school browsing, multiple jacket styles per school, responsive image galleries, structured ZIP/CSV imports, live Gutenberg blocks, WooCommerce product tools, and organization-owned automatic updates.",'changelog':'<h4>1.0.6</h4><ul><li>Moved Available Customizations beneath the jacket style selector.</li><li>Removed the extra customization grid row and gave the gallery more horizontal room.</li><li>Compacted Browse by School spacing on desktop, tablet, and mobile.</li></ul>'}
          Path('latest.json').write_text(json.dumps(latest,indent=2)+'\n')
          Path('update.json').write_text(json.dumps({'version':'1.0.6','name':'All Star Varsity Jackets 1.0.6','prerelease':False,'package':url,'html_url':'https://github.com/All-Star-Embroidery/varsity-jackets','published_at':now,'body':'Compact Browse by School layout.'},indent=2)+'\n')
          PY
          git add latest.json update.json
          git commit -m 'release: point updater to 1.0.6'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify
        run: |
          sleep 3
          curl --fail --location --retry 5 --retry-delay 2 'https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?v=106' -o /tmp/latest.json
          python3 -c "import json; d=json.load(open('/tmp/latest.json')); assert d['version']=='1.0.6'"
          curl --fail --location --retry 5 --retry-delay 2 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.6/all-star-varsity-jackets-1.0.6.zip' -o /tmp/asevj.zip
          unzip -t /tmp/asevj.zip >/dev/null
