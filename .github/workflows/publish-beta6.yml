name: Publish beta.6

on:
  push:
    paths:
      - '.github/workflows/publish-beta6.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build beta.6 from beta.5 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asevj-beta6
          mkdir -p /tmp/asevj-beta6
          unzip -q releases/all-star-varsity-jackets-0.2.0-beta.5.zip -d /tmp/asevj-beta6
          cd /tmp/asevj-beta6/all-star-varsity-jackets
          python - <<'PY'
          import json, pathlib
          base=pathlib.Path('.')
          attrs={
            'titleSize': {'type':'number','default':0},
            'kickerSize': {'type':'number','default':0},
            'bodySize': {'type':'number','default':0},
            'contentPaddingX': {'type':'number','default':0},
            'contentPaddingY': {'type':'number','default':0},
            'featureScale': {'type':'number','default':100},
            'jacketScale': {'type':'number','default':100},
            'visualBackgroundColor': {'type':'string','default':'#07111F'},
            'jacketOverlayColor': {'type':'string','default':'#0B162A'},
            'jacketOverlayOpacity': {'type':'number','default':18},
            'glowColor': {'type':'string','default':'#27456F'},
            'glowOpacity': {'type':'number','default':32},
            'glowSize': {'type':'number','default':68}
          }
          for fn in ['blocks/hero/block.json','blocks/full-experience/block.json']:
              p=base/fn; d=json.loads(p.read_text()); d['version']='0.2.0-beta.6'; d['attributes'].update(attrs); p.write_text(json.dumps(d,indent=2)+'\n')
          for fn in ['blocks/browser/block.json','blocks/benefits/block.json']:
              p=base/fn; d=json.loads(p.read_text()); d['version']='0.2.0-beta.6'; p.write_text(json.dumps(d,indent=2)+'\n')

          p=base/'includes/class-asevj-render.php'; s=p.read_text()
          old="$hero_style .= '--asevj-hero-bg:' . $hero_bg . ';--asevj-hero-top-fade:' . $fade_color . ';--asevj-hero-top-fade-height:' . $fade_height . 'px;';"
          new="""$hero_style .= '--asevj-hero-bg:' . $hero_bg . ';--asevj-hero-top-fade:' . $fade_color . ';--asevj-hero-top-fade-height:' . $fade_height . 'px;';
        $hero_style .= '--asevj-hero-title-size:' . ( ! empty( $attributes['titleSize'] ) ? min( 110, max( 32, absint( $attributes['titleSize'] ) ) ) . 'px' : 'clamp(52px,5.2vw,82px)' ) . ';';
        $hero_style .= '--asevj-hero-kicker-size:' . ( ! empty( $attributes['kickerSize'] ) ? min( 32, max( 10, absint( $attributes['kickerSize'] ) ) ) . 'px' : 'clamp(14px,1.25vw,19px)' ) . ';';
        $hero_style .= '--asevj-hero-body-size:' . ( ! empty( $attributes['bodySize'] ) ? min( 28, max( 11, absint( $attributes['bodySize'] ) ) ) . 'px' : '15px' ) . ';';
        $hero_style .= '--asevj-hero-pad-x:' . ( ! empty( $attributes['contentPaddingX'] ) ? min( 160, max( 10, absint( $attributes['contentPaddingX'] ) ) ) . 'px' : 'clamp(32px,5.5vw,84px)' ) . ';';
        $hero_style .= '--asevj-hero-pad-y:' . ( ! empty( $attributes['contentPaddingY'] ) ? min( 140, max( 10, absint( $attributes['contentPaddingY'] ) ) ) . 'px' : '38px' ) . ';';
        $hero_style .= '--asevj-hero-feature-scale:' . min( 180, max( 60, absint( $attributes['featureScale'] ?? 100 ) ) ) . ';';
        $hero_style .= '--asevj-hero-jacket-scale:' . min( 145, max( 70, absint( $attributes['jacketScale'] ?? 100 ) ) ) . ';';
        $hero_style .= '--asevj-hero-visual-bg:' . self::block_color( $attributes, 'visualBackgroundColor', '#07111F' ) . ';';
        $hero_style .= '--asevj-hero-overlay:' . self::block_color( $attributes, 'jacketOverlayColor', '#0B162A' ) . ';';
        $hero_style .= '--asevj-hero-overlay-opacity:' . min( 80, max( 0, absint( $attributes['jacketOverlayOpacity'] ?? 18 ) ) ) . '%;';
        $hero_style .= '--asevj-hero-glow:' . self::block_color( $attributes, 'glowColor', '#27456F' ) . ';';
        $hero_style .= '--asevj-hero-glow-opacity:' . min( 85, max( 0, absint( $attributes['glowOpacity'] ?? 32 ) ) ) . '%;';
        $hero_style .= '--asevj-hero-glow-size:' . min( 100, max( 20, absint( $attributes['glowSize'] ?? 68 ) ) ) . '%;';"""
          if old not in s: raise SystemExit('render anchor not found')
          p.write_text(s.replace(old,new))

          p=base/'assets/frontend.css'; s=p.read_text()
          s=s.replace('padding:38px clamp(32px,5.5vw,84px);','padding:var(--asevj-hero-pad-y,38px) var(--asevj-hero-pad-x,clamp(32px,5.5vw,84px));')
          s=s.replace('font-size:clamp(52px,5.2vw,82px);','font-size:var(--asevj-hero-title-size,clamp(52px,5.2vw,82px));')
          s=s.replace('font-size:clamp(14px,1.25vw,19px);','font-size:var(--asevj-hero-kicker-size,clamp(14px,1.25vw,19px));')
          s=s.replace('color:#edf1f6;font-size:15px;','color:#edf1f6;font-size:var(--asevj-hero-body-size,15px);')
          s=s.replace('.asevj-hero__features{display:grid;', '.asevj-hero__features{display:grid;transform:scale(calc(var(--asevj-hero-feature-scale,100) / 100));transform-origin:left top;')
          s=s.replace('.asevj-hero__visual{position:relative;min-height:var(--asevj-hero-height,390px);background:#061327;overflow:hidden}', '.asevj-hero__visual{position:relative;min-height:var(--asevj-hero-height,390px);background:var(--asevj-hero-visual-bg,#07111F);overflow:hidden}')
          oldcss='.asevj-hero__visual:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--asevj-navy) 0,rgba(16,27,49,.58) 12%,rgba(16,27,49,.08) 46%,rgba(4,13,26,.2) 100%);pointer-events:none}.asevj-hero__visual:after{content:"";position:absolute;inset:0;z-index:2;box-shadow:inset 0 -45px 65px rgba(4,13,26,.22);pointer-events:none}.asevj-hero__visual img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}'
          newcss='.asevj-hero__visual:before{content:"";position:absolute;inset:0;z-index:3;background:linear-gradient(90deg,var(--asevj-navy) 0,color-mix(in srgb,var(--asevj-hero-overlay,#0B162A) var(--asevj-hero-overlay-opacity,18%),transparent) 30%,transparent 72%);pointer-events:none}.asevj-hero__visual:after{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(ellipse at 58% 50%,color-mix(in srgb,var(--asevj-hero-glow,#27456F) var(--asevj-hero-glow-opacity,32%),transparent) 0%,transparent var(--asevj-hero-glow-size,68%));box-shadow:inset 0 -45px 65px rgba(4,13,26,.22);pointer-events:none}.asevj-hero__visual img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:center;display:block;transform:scale(calc(var(--asevj-hero-jacket-scale,100) / 100));transform-origin:center center}'
          if oldcss not in s: raise SystemExit('css anchor not found')
          p.write_text(s.replace(oldcss,newcss))

          p=base/'assets/editor.js'; s=p.read_text()
          anchor="            layout.push(el(RangeControl, { key: 'heroHeight', label: __('Hero height override', 'all-star-varsity-jackets'), help: attrs.heroHeight ? __('Overrides the global height for this block.', 'all-star-varsity-jackets') : __('0 uses the global Design Setting.', 'all-star-varsity-jackets'), value: attrs.heroHeight || 0, min: 0, max: 720, step: 10, onChange: function (value) { update(props, 'heroHeight', value || 0); } }));\n"
          extra="""            layout.push(el(RangeControl, { key: 'titleSize', label: __('Hero title size', 'all-star-varsity-jackets'), help: __('0 keeps the responsive default.', 'all-star-varsity-jackets'), value: attrs.titleSize || 0, min: 0, max: 110, step: 2, onChange: function (value) { update(props, 'titleSize', value || 0); } }));
            layout.push(el(RangeControl, { key: 'kickerSize', label: __('Kicker size', 'all-star-varsity-jackets'), value: attrs.kickerSize || 0, min: 0, max: 32, step: 1, onChange: function (value) { update(props, 'kickerSize', value || 0); } }));
            layout.push(el(RangeControl, { key: 'bodySize', label: __('Description size', 'all-star-varsity-jackets'), value: attrs.bodySize || 0, min: 0, max: 28, step: 1, onChange: function (value) { update(props, 'bodySize', value || 0); } }));
            layout.push(el(RangeControl, { key: 'contentPaddingX', label: __('Content horizontal padding', 'all-star-varsity-jackets'), value: attrs.contentPaddingX || 0, min: 0, max: 160, step: 4, onChange: function (value) { update(props, 'contentPaddingX', value || 0); } }));
            layout.push(el(RangeControl, { key: 'contentPaddingY', label: __('Content vertical padding', 'all-star-varsity-jackets'), value: attrs.contentPaddingY || 0, min: 0, max: 140, step: 4, onChange: function (value) { update(props, 'contentPaddingY', value || 0); } }));
            layout.push(el(RangeControl, { key: 'featureScale', label: __('Three feature cards scale', 'all-star-varsity-jackets'), value: attrs.featureScale || 100, min: 60, max: 180, step: 5, onChange: function (value) { update(props, 'featureScale', value || 100); } }));
            layout.push(el(RangeControl, { key: 'jacketScale', label: __('Jacket image scale', 'all-star-varsity-jackets'), value: attrs.jacketScale || 100, min: 70, max: 145, step: 5, onChange: function (value) { update(props, 'jacketScale', value || 100); } }));
"""
          if anchor not in s: raise SystemExit('editor layout anchor not found')
          s=s.replace(anchor,anchor+extra)
          marker='        var panels = [];\n'
          appearance="""        if (Object.prototype.hasOwnProperty.call(attrs, 'visualBackgroundColor')) {
            appearance.push(el('div', { key: 'visualBackgroundColor', className: 'asevj-editor-color-control' }, el('strong', {}, __('Area behind jacket', 'all-star-varsity-jackets')), el(ColorPalette, { value: attrs.visualBackgroundColor || '#07111F', clearable: false, colors: [{name:__('Black Navy','all-star-varsity-jackets'),color:'#07111F'},{name:__('Deep Navy','all-star-varsity-jackets'),color:'#0B162A'},{name:__('All Star Navy','all-star-varsity-jackets'),color:'#101B31'},{name:__('Slate Navy','all-star-varsity-jackets'),color:'#17243A'}], onChange:function(value){update(props,'visualBackgroundColor',value||'#07111F');} })));
            appearance.push(el('div', { key: 'jacketOverlayColor', className: 'asevj-editor-color-control' }, el('strong', {}, __('Jacket image color blend', 'all-star-varsity-jackets')), el(ColorPalette, { value: attrs.jacketOverlayColor || '#0B162A', clearable:false, colors:[{name:__('Deep Navy','all-star-varsity-jackets'),color:'#0B162A'},{name:__('All Star Navy','all-star-varsity-jackets'),color:'#101B31'},{name:__('Black Navy','all-star-varsity-jackets'),color:'#07111F'}], onChange:function(value){update(props,'jacketOverlayColor',value||'#0B162A');} })));
            appearance.push(el(RangeControl, { key:'jacketOverlayOpacity', label:__('Color blend strength','all-star-varsity-jackets'), value:attrs.jacketOverlayOpacity==null?18:attrs.jacketOverlayOpacity, min:0, max:80, step:2, onChange:function(value){update(props,'jacketOverlayOpacity',value||0);} }));
            appearance.push(el('div', { key:'glowColor', className:'asevj-editor-color-control' }, el('strong', {}, __('Glow behind jacket','all-star-varsity-jackets')), el(ColorPalette, { value:attrs.glowColor||'#27456F', clearable:false, colors:[{name:__('Soft Blue','all-star-varsity-jackets'),color:'#27456F'},{name:__('All Star Navy','all-star-varsity-jackets'),color:'#101B31'},{name:__('Cool Slate','all-star-varsity-jackets'),color:'#3B526F'},{name:__('Gold','all-star-varsity-jackets'),color:'#D6A83A'}], onChange:function(value){update(props,'glowColor',value||'#27456F');} })));
            appearance.push(el(RangeControl, { key:'glowOpacity', label:__('Glow intensity','all-star-varsity-jackets'), value:attrs.glowOpacity==null?32:attrs.glowOpacity, min:0, max:85, step:5, onChange:function(value){update(props,'glowOpacity',value||0);} }));
            appearance.push(el(RangeControl, { key:'glowSize', label:__('Glow spread','all-star-varsity-jackets'), value:attrs.glowSize||68, min:20, max:100, step:5, onChange:function(value){update(props,'glowSize',value||68);} }));
        }

"""
          if marker not in s: raise SystemExit('editor appearance anchor not found')
          s=s.replace(marker,appearance+marker)
          old="        heroHeight: { type: 'number', default: 0 },\n        backgroundColor: { type: 'string', default: '' },\n"
          new="        heroHeight: { type: 'number', default: 0 },\n        titleSize: { type: 'number', default: 0 },\n        kickerSize: { type: 'number', default: 0 },\n        bodySize: { type: 'number', default: 0 },\n        contentPaddingX: { type: 'number', default: 0 },\n        contentPaddingY: { type: 'number', default: 0 },\n        featureScale: { type: 'number', default: 100 },\n        jacketScale: { type: 'number', default: 100 },\n        visualBackgroundColor: { type: 'string', default: '#07111F' },\n        jacketOverlayColor: { type: 'string', default: '#0B162A' },\n        jacketOverlayOpacity: { type: 'number', default: 18 },\n        glowColor: { type: 'string', default: '#27456F' },\n        glowOpacity: { type: 'number', default: 32 },\n        glowSize: { type: 'number', default: 68 },\n        backgroundColor: { type: 'string', default: '' },\n"
          if old not in s: raise SystemExit('editor attributes anchor not found')
          p.write_text(s.replace(old,new))

          for fn in ['all-star-varsity-jackets.php','readme.txt','README.md']:
              p=base/fn; p.write_text(p.read_text().replace('0.2.0-beta.5','0.2.0-beta.6'))
          p=base/'CHANGELOG.md'; s=p.read_text(); entry="""## 0.2.0-beta.6 — 2026-08-21

- Adds Gutenberg controls for hero text sizing and content padding.
- Adds scaling controls for the three hero feature cards and signature jacket.
- Adds jacket-side background and navy color-blend controls.
- Adds adjustable glow color, intensity, and spread behind the jacket.
- Controls work in both Varsity Hero and Full Varsity Jackets Experience blocks.

"""; p.write_text(s.replace('# Changelog\n\n','# Changelog\n\n'+entry))
          PY
          node --check assets/editor.js
          php -l includes/class-asevj-render.php
          php -l all-star-varsity-jackets.php
          cd /tmp/asevj-beta6
          rm -f all-star-varsity-jackets-0.2.0-beta.6.zip
          zip -qr all-star-varsity-jackets-0.2.0-beta.6.zip all-star-varsity-jackets
          unzip -t all-star-varsity-jackets-0.2.0-beta.6.zip >/dev/null
          SHA=$(sha256sum all-star-varsity-jackets-0.2.0-beta.6.zip | awk '{print $1}')
          cd "$GITHUB_WORKSPACE"
          rm -rf all-star-varsity-jackets
          cp -a /tmp/asevj-beta6/all-star-varsity-jackets ./all-star-varsity-jackets
          cp /tmp/asevj-beta6/all-star-varsity-jackets-0.2.0-beta.6.zip releases/
          python - <<PY
          import json
          p='update.json'; d=json.load(open(p)); d.update({'version':'0.2.0-beta.6','name':'All Star Varsity Jackets 0.2.0-beta.6','prerelease':True,'package':'https://raw.githubusercontent.com/rolejarczyk/ASE.VarsityJackets/main/releases/all-star-varsity-jackets-0.2.0-beta.6.zip','published_at':'2026-08-21T20:48:00Z','sha256':'$SHA','body':'Adds visual hero controls for text size, padding, feature-card scale, jacket scale, jacket-side color blending, and adjustable jacket glow.'}); open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-varsity-jackets releases/all-star-varsity-jackets-0.2.0-beta.6.zip update.json
          git commit -m 'Release All Star Varsity Jackets 0.2.0-beta.6'
          git push origin HEAD:main
