name: Publish WordPress Plugin Release

# Manual-only by design. Build source first, add matching release notes, then run
# this workflow with the exact plugin version. All releases and WordPress update
# manifests are owned by All-Star-Embroidery/varsity-jackets.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.4"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ase-varsity-jackets-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: pkg
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          MAIN='all-star-varsity-jackets/all-star-varsity-jackets.php'
          HEADER_VERSION=$(sed -nE 's/^ \* Version: (.+)$/\1/p' "$MAIN" | head -n1 | tr -d '\r')
          INTERNAL_VERSION=$(sed -nE "s/^define\( 'ASEVJ_VERSION', '([^']+)' \);$/\1/p" "$MAIN" | head -n1 | tr -d '\r')

          test -n "$HEADER_VERSION"
          test "$HEADER_VERSION" = "$INTERNAL_VERSION"
          [[ "$HEADER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          test "$REQUESTED_VERSION" = "$HEADER_VERSION" || {
            echo "Requested version $REQUESTED_VERSION does not match plugin source $HEADER_VERSION" >&2
            exit 1
          }

          VERSION="$HEADER_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=all-star-varsity-jackets-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate source and release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          NOTES="releases/RELEASE-${VERSION}.md"

          test -f "$NOTES"

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)

          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

          grep -q 'Update URI: https://github.com/All-Star-Embroidery/varsity-jackets' \
            all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q "RELEASE_REPO = 'All-Star-Embroidery/varsity-jackets'" \
            all-star-varsity-jackets/includes/class-asevj-updater.php

      - name: Build and validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          ZIP="$GITHUB_WORKSPACE/${{ steps.pkg.outputs.zip }}"
          BUILD='/tmp/asevj-plugin-build'
          PLUGIN='all-star-varsity-jackets'

          rm -rf "$BUILD" "$ZIP"
          mkdir -p "$BUILD/$PLUGIN"
          cp -R "$PLUGIN"/. "$BUILD/$PLUGIN/"
          rm -rf "$BUILD/$PLUGIN/.git" "$BUILD/$PLUGIN/.github" "$BUILD/$PLUGIN/tests" "$BUILD/$PLUGIN/node_modules"

          cd "$BUILD"
          zip -qr "$ZIP" "$PLUGIN"
          unzip -t "$ZIP" >/dev/null

          TOP_LEVEL=$(zipinfo -1 "$ZIP" | awk -F/ 'NF {print $1}' | sort -u)
          test "$TOP_LEVEL" = 'all-star-varsity-jackets'
          test "$(zipinfo -1 "$ZIP" | grep -c '^all-star-varsity-jackets/all-star-varsity-jackets.php$')" -eq 1

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          ZIP='${{ steps.pkg.outputs.zip }}'
          TAG='${{ steps.pkg.outputs.tag }}'
          NOTES="releases/RELEASE-${VERSION}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" \
              --title "All Star Varsity Jackets v${VERSION}" \
              --notes-file "$NOTES" \
              --latest
          else
            EXTRA=()
            if [ '${{ steps.pkg.outputs.prerelease }}' = 'true' ]; then
              EXTRA+=(--prerelease)
            fi
            gh release create "$TAG" "$ZIP" \
              --target main \
              --title "All Star Varsity Jackets v${VERSION}" \
              --notes-file "$NOTES" \
              --latest \
              "${EXTRA[@]}"
          fi

      - name: Verify published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          ZIP='${{ steps.pkg.outputs.zip }}'
          TAG='${{ steps.pkg.outputs.tag }}'
          EXPECTED="https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/${TAG}/${ZIP}"

          gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$ZIP\") | .name" | grep -qx "$ZIP"
          rm -f /tmp/asevj-release-verify.zip
          curl --fail --location --retry 4 --retry-delay 2 "$EXPECTED" -o /tmp/asevj-release-verify.zip
          unzip -t /tmp/asevj-release-verify.zip >/dev/null
          zipinfo -1 /tmp/asevj-release-verify.zip | grep -q '^all-star-varsity-jackets/all-star-varsity-jackets.php$'
          unzip -p /tmp/asevj-release-verify.zip all-star-varsity-jackets/includes/class-asevj-updater.php \
            | grep -q 'All-Star-Embroidery/varsity-jackets'

      - name: Update WordPress manifests
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          ZIP='${{ steps.pkg.outputs.zip }}'
          TAG='${{ steps.pkg.outputs.tag }}'

          python3 - <<PY
          import html, json, re
          from datetime import datetime, timezone
          from pathlib import Path

          version = "$VERSION"
          tag = "$TAG"
          zip_name = "$ZIP"
          notes = Path(f"releases/RELEASE-{version}.md").read_text(encoding="utf-8")

          bullets = []
          in_section = False
          for line in notes.splitlines():
              heading = line.strip().lower()
              if heading in {"## changes", "## highlights", "## what's new", "## what’s new"}:
                  in_section = True
                  continue
              if in_section and line.startswith("## "):
                  break
              if in_section and re.match(r"^[-*]\s+", line.strip()):
                  bullets.append(re.sub(r"^[-*]\s+", "", line.strip()))

          changelog = f"<h4>{html.escape(version)}</h4>"
          if bullets:
              changelog += "<ul>" + "".join(f"<li>{html.escape(x)}</li>" for x in bullets) + "</ul>"

          download_url = f"https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/{tag}/{zip_name}"
          homepage = "https://github.com/All-Star-Embroidery/varsity-jackets"
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S +0000")
          description = (
              "All Star Embroidery's WordPress/WooCommerce varsity jacket system with school browsing, "
              "multi-style galleries, structured imports, responsive Gutenberg blocks, and WooCommerce product tools."
          )

          latest = {
              "name": "All Star Varsity Jackets",
              "slug": "all-star-varsity-jackets",
              "version": version,
              "download_url": download_url,
              "homepage": homepage,
              "requires": "6.4",
              "tested": "6.8",
              "requires_php": "8.0",
              "last_updated": now,
              "description": description,
              "changelog": changelog,
          }
          Path("latest.json").write_text(json.dumps(latest, indent=2) + "\n", encoding="utf-8")

          legacy = {
              "version": version,
              "name": f"All Star Varsity Jackets {version}",
              "prerelease": bool(re.search(r"(?:alpha|beta|rc)", version, re.I)),
              "package": download_url,
              "html_url": homepage,
              "published_at": now,
              "body": f"All Star Varsity Jackets {version}. See the GitHub Release notes for details.",
          }
          Path("update.json").write_text(json.dumps(legacy, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json update.json
          git commit -m "release: point WordPress updater to ${VERSION}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify public update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          TAG='${{ steps.pkg.outputs.tag }}'
          ZIP='${{ steps.pkg.outputs.zip }}'
          EXPECTED="https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/${TAG}/${ZIP}"

          sleep 3
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?run=${GITHUB_RUN_ID}" \
            -o /tmp/latest.json

          python3 - <<PY
          import json
          data = json.load(open('/tmp/latest.json'))
          assert data['version'] == "$VERSION", data
          assert data['download_url'] == "$EXPECTED", data
          assert 'All-Star-Embroidery/varsity-jackets' in data['homepage'], data
          print('Update channel verified:', data['version'], data['download_url'])
          PY
