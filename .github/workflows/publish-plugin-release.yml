name: Publish WordPress Plugin Release

# Manual-only by design. GitHub Actions minutes are limited, so ordinary pushes,
# documentation edits, migrations, and historical-version preservation must not
# consume runner time. Run this workflow only when intentionally publishing a
# real current plugin release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.4"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ase-varsity-jackets-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: pkg
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          MAIN='all-star-varsity-jackets/all-star-varsity-jackets.php'
          HEADER_VERSION=$(sed -nE 's/^ \* Version: (.+)$/\1/p' "$MAIN" | head -n1 | tr -d '\r')
          INTERNAL_VERSION=$(sed -nE "s/^define\( 'ASEVJ_VERSION', '([^']+)' \);$/\1/p" "$MAIN" | head -n1 | tr -d '\r')

          test -n "$HEADER_VERSION"
          test "$HEADER_VERSION" = "$INTERNAL_VERSION"
          [[ "$HEADER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]

          test "$REQUESTED_VERSION" = "$HEADER_VERSION" || {
            echo "Requested version $REQUESTED_VERSION does not match plugin source $HEADER_VERSION" >&2
            exit 1
          }

          VERSION="$HEADER_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=all-star-varsity-jackets-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "tag=asevj-v$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)

          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

          test -f "releases/RELEASE-${{ steps.pkg.outputs.version }}.md"

      - name: Build WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ steps.pkg.outputs.version }}'
          BUILD='/tmp/asevj-plugin-build'
          PLUGIN_FOLDER='all-star-varsity-jackets'
          ZIP="$GITHUB_WORKSPACE/all-star-varsity-jackets-${VERSION}.zip"

          rm -rf "$BUILD" "$ZIP"
          mkdir -p "$BUILD/$PLUGIN_FOLDER"
          cp -R all-star-varsity-jackets/. "$BUILD/$PLUGIN_FOLDER/"

          rm -rf "$BUILD/$PLUGIN_FOLDER/.git"
          rm -rf "$BUILD/$PLUGIN_FOLDER/.github"
          rm -rf "$BUILD/$PLUGIN_FOLDER/tests"
          rm -rf "$BUILD/$PLUGIN_FOLDER/node_modules"

          cd "$BUILD"
          zip -qr "$ZIP" "$PLUGIN_FOLDER"

      - name: Validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ steps.pkg.outputs.version }}'
          ZIP="all-star-varsity-jackets-${VERSION}.zip"

          test -f "$ZIP"
          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | grep -q 'all-star-varsity-jackets/all-star-varsity-jackets.php'

          TOP_LEVEL=$(zipinfo -1 "$ZIP" | awk -F/ 'NF {print $1}' | sort -u)
          test "$TOP_LEVEL" = 'all-star-varsity-jackets' || {
            echo "Unexpected ZIP root(s): $TOP_LEVEL" >&2
            exit 1
          }

          COUNT_MAIN=$(zipinfo -1 "$ZIP" | grep -c '^all-star-varsity-jackets/all-star-varsity-jackets.php$')
          test "$COUNT_MAIN" -eq 1

          echo 'ZIP VALID:'
          unzip -l "$ZIP"

      - name: Create or update GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ steps.pkg.outputs.version }}'
          ZIP='${{ steps.pkg.outputs.zip }}'
          TAG='${{ steps.pkg.outputs.tag }}'
          NOTES="releases/RELEASE-${VERSION}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "All Star Varsity Jackets v${VERSION}" --notes-file "$NOTES"
          else
            EXTRA=()
            if [ '${{ steps.pkg.outputs.prerelease }}' = 'true' ]; then
              EXTRA+=(--prerelease)
            fi
            gh release create "$TAG" "$ZIP" \
              --target main \
              --title "All Star Varsity Jackets v${VERSION}" \
              --notes-file "$NOTES" \
              "${EXTRA[@]}"
          fi

      - name: Verify published Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ steps.pkg.outputs.version }}'
          ZIP='${{ steps.pkg.outputs.zip }}'
          TAG='${{ steps.pkg.outputs.tag }}'
          EXPECTED_URL="https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/${TAG}/${ZIP}"

          ASSET_URL=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$ZIP\") | .url" | head -n1)
          test -n "$ASSET_URL" || { echo 'Release asset was not found after upload.' >&2; exit 1; }

          rm -f /tmp/asevj-release-verify.zip
          curl --fail --location --retry 3 --retry-delay 2 "$EXPECTED_URL" -o /tmp/asevj-release-verify.zip
          unzip -t /tmp/asevj-release-verify.zip >/dev/null
          zipinfo -1 /tmp/asevj-release-verify.zip | grep -q '^all-star-varsity-jackets/all-star-varsity-jackets.php$'

          echo "Verified release asset: $EXPECTED_URL"

      - name: Update WordPress manifests after asset verification
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ steps.pkg.outputs.version }}'
          ZIP='${{ steps.pkg.outputs.zip }}'
          TAG='${{ steps.pkg.outputs.tag }}'

          python3 - <<PY
          import html
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          version = "$VERSION"
          tag = "$TAG"
          zip_name = "$ZIP"
          notes_path = Path(f"releases/RELEASE-{version}.md")
          notes = notes_path.read_text(encoding="utf-8")

          bullets = []
          in_changes = False
          for line in notes.splitlines():
              if line.strip().lower() == "## changes":
                  in_changes = True
                  continue
              if in_changes and line.startswith("## "):
                  break
              if in_changes and re.match(r"^[-*]\s+", line.strip()):
                  bullets.append(re.sub(r"^[-*]\s+", "", line.strip()))

          changelog = f"<h4>{html.escape(version)}</h4>"
          if bullets:
              changelog += "<ul>" + "".join(f"<li>{html.escape(x)}</li>" for x in bullets) + "</ul>"

          download_url = (
              f"https://github.com/All-Star-Embroidery/varsity-jackets/"
              f"releases/download/{tag}/{zip_name}"
          )
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S +0000")

          latest = {
              "name": "All Star Varsity Jackets",
              "slug": "all-star-varsity-jackets",
              "version": version,
              "download_url": download_url,
              "homepage": "https://github.com/All-Star-Embroidery/varsity-jackets",
              "requires": "6.4",
              "tested": "6.8",
              "requires_php": "8.0",
              "last_updated": now,
              "description": "School-based varsity jacket collections with structured school imports, live Gutenberg blocks, gallery management, and optional WooCommerce products for All Star Embroidery.",
              "changelog": changelog,
          }
          Path("latest.json").write_text(json.dumps(latest, indent=2) + "\n", encoding="utf-8")

          legacy = {
              "version": version,
              "name": f"All Star Varsity Jackets {version}",
              "prerelease": bool(re.search(r"(?:alpha|beta|rc)", version, re.I)),
              "package": download_url,
              "html_url": "https://github.com/All-Star-Embroidery/varsity-jackets",
              "published_at": now,
              "body": "GitHub Release asset compatibility bridge. Newer builds use latest.json.",
          }
          Path("update.json").write_text(json.dumps(legacy, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json update.json
          git commit -m "release: point WordPress updater to ${VERSION}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify public manifest points to Release asset
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ steps.pkg.outputs.version }}'
          TAG='${{ steps.pkg.outputs.tag }}'
          ZIP='${{ steps.pkg.outputs.zip }}'
          EXPECTED="https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/${TAG}/${ZIP}"

          sleep 3
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?run=${GITHUB_RUN_ID}" \
            -o /tmp/latest.json

          python3 - <<PY
          import json
          data=json.load(open('/tmp/latest.json'))
          assert data['version'] == "$VERSION", data
          assert data['download_url'] == "$EXPECTED", data
          assert '/releases/download/' in data['download_url'], data
          print('Manifest verified:', data['version'], data['download_url'])
          PY
