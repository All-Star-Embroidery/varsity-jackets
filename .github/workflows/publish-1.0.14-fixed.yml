name: Publish 1.0.14

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-1.0.14-fixed.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: python3 scripts/release_1_0_14.py

      - name: Validate
        run: |
          set -e
          grep -q '^ \* Version: 1.0.14$' all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q "define( 'ASEVJ_VERSION', '1.0.14' );" all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q 'same_school_styles' all-star-varsity-jackets/includes/class-asevj-product-page.php
          grep -q 'asevj-vjpp__style-switcher' all-star-varsity-jackets/includes/class-asevj-product-page.php
          php -l all-star-varsity-jackets/includes/class-asevj-product-page.php
          node --check all-star-varsity-jackets/blocks/product-page/editor.js
          python3 -m json.tool all-star-varsity-jackets/blocks/product-page/block.json >/dev/null

      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-varsity-jackets
          git commit -m 'release: school-first product identity in 1.0.14' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build ZIP
        run: |
          rm -rf /tmp/asevj114 all-star-varsity-jackets-1.0.14.zip
          mkdir -p /tmp/asevj114/all-star-varsity-jackets
          cp -R all-star-varsity-jackets/. /tmp/asevj114/all-star-varsity-jackets/
          cd /tmp/asevj114
          zip -qr "$GITHUB_WORKSPACE/all-star-varsity-jackets-1.0.14.zip" all-star-varsity-jackets
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-varsity-jackets-1.0.14.zip >/dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.14 all-star-varsity-jackets-1.0.14.zip --target main --title 'All Star Varsity Jackets v1.0.14' --notes-file releases/RELEASE-1.0.14.md --latest

      - name: Update manifests
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          url = 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.14/all-star-varsity-jackets-1.0.14.zip'
          homepage = 'https://github.com/All-Star-Embroidery/varsity-jackets'
          latest = {'name':'All Star Varsity Jackets','slug':'all-star-varsity-jackets','version':'1.0.14','download_url':url,'homepage':homepage,'requires':'6.4','tested':'6.8','requires_php':'8.0','last_updated':now,'description':"All Star Embroidery's WordPress/WooCommerce varsity jacket system with theme-compatible dedicated jacket product pages, school browsing, galleries, imports, and WooCommerce product tools.",'changelog':'<h4>1.0.14</h4><ul><li>Makes the school name the primary product-page heading.</li><li>Moves the jacket style name into a smaller subtitle.</li><li>Adds a same-school jacket style switcher below mascot/location details.</li></ul>'}
          Path('latest.json').write_text(json.dumps(latest, indent=2)+'\n', encoding='utf-8')
          Path('update.json').write_text(json.dumps({'version':'1.0.14','name':'All Star Varsity Jackets 1.0.14','prerelease':False,'package':url,'html_url':homepage,'published_at':now,'body':'School-first product identity and same-school style switching.'}, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json update.json
          git commit -m 'release: point updater to 1.0.14'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify
        run: |
          sleep 3
          curl --fail --location --retry 5 --retry-delay 2 "https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?run=${GITHUB_RUN_ID}" -o /tmp/latest.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/latest.json'))
          assert data['version']=='1.0.14', data
          PY
          curl --fail --location --retry 5 --retry-delay 2 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.14/all-star-varsity-jackets-1.0.14.zip' -o /tmp/asevj114.zip
          unzip -t /tmp/asevj114.zip >/dev/null
