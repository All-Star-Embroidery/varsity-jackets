name: Publish 1.0.14 School-First Product Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.14.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply 1.0.14 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('all-star-varsity-jackets')

          # Version bump.
          main = root / 'all-star-varsity-jackets.php'
          s = main.read_text(encoding='utf-8')
          s = s.replace('Version: 1.0.13', 'Version: 1.0.14')
          s = s.replace("define( 'ASEVJ_VERSION', '1.0.13' );", "define( 'ASEVJ_VERSION', '1.0.14' );")
          main.write_text(s, encoding='utf-8')

          # Block metadata + new customization attributes.
          for p in (root / 'blocks').glob('*/block.json'):
              data = json.loads(p.read_text(encoding='utf-8'))
              data['version'] = '1.0.14'
              if data.get('name') == 'all-star-varsity-jackets/product-page':
                  attrs = data.setdefault('attributes', {})
                  attrs['styleSwitcherLabel'] = {'type':'string','default':'JACKET STYLES'}
                  attrs['showStyleSwitcher'] = {'type':'boolean','default':True}
                  styles = data.get('style', [])
                  if isinstance(styles, str):
                      styles = [styles]
                  if 'file:./identity.css' not in styles:
                      styles.append('file:./identity.css')
                  data['style'] = styles
              p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          # Gutenberg controls.
          editor = root / 'blocks/product-page/editor.js'
          e = editor.read_text(encoding='utf-8')
          if "styleSwitcherLabel: { type: 'string', default: 'JACKET STYLES' }" not in e:
              e = e.replace(
                  "        eyebrow: { type: 'string', default: 'CUSTOM VARSITY JACKET' },\n",
                  "        eyebrow: { type: 'string', default: 'CUSTOM VARSITY JACKET' },\n        styleSwitcherLabel: { type: 'string', default: 'JACKET STYLES' },\n"
              )
          if "showStyleSwitcher: { type: 'boolean', default: true }" not in e:
              e = e.replace(
                  "        showSchoolMeta: { type: 'boolean', default: true },\n",
                  "        showSchoolMeta: { type: 'boolean', default: true },\n        showStyleSwitcher: { type: 'boolean', default: true },\n"
              )
          if "label: __('Style switcher label'" not in e:
              e = e.replace(
                  "                        el(TextControl, { label: __('Eyebrow', 'all-star-varsity-jackets'), value: a.eyebrow || '', onChange: function (value) { set(props, 'eyebrow', value); } }),\n",
                  "                        el(TextControl, { label: __('Eyebrow', 'all-star-varsity-jackets'), value: a.eyebrow || '', onChange: function (value) { set(props, 'eyebrow', value); } }),\n                        el(TextControl, { label: __('Style switcher label', 'all-star-varsity-jackets'), value: a.styleSwitcherLabel || 'JACKET STYLES', onChange: function (value) { set(props, 'styleSwitcherLabel', value); } }),\n"
              )
          if "label: __('Show other styles for this school'" not in e:
              e = e.replace(
                  "                        el(ToggleControl, { label: __('Show school / mascot / location', 'all-star-varsity-jackets'), checked: a.showSchoolMeta !== false, onChange: function (value) { set(props, 'showSchoolMeta', value); } }),\n",
                  "                        el(ToggleControl, { label: __('Show school / mascot / location', 'all-star-varsity-jackets'), checked: a.showSchoolMeta !== false, onChange: function (value) { set(props, 'showSchoolMeta', value); } }),\n                        el(ToggleControl, { label: __('Show other styles for this school', 'all-star-varsity-jackets'), checked: a.showStyleSwitcher !== false, onChange: function (value) { set(props, 'showStyleSwitcher', value); } }),\n"
              )
          editor.write_text(e, encoding='utf-8')

          # Product-page data + markup.
          product = root / 'includes/class-asevj-product-page.php'
          p = product.read_text(encoding='utf-8')

          helper_anchor = "    public static function render( array $attributes = [] ): string {\n"
          helper = r'''    private static function same_school_styles( int $school_id, int $current_style_id ): array {
        if ( ! $school_id ) {
            return [];
        }

        $style_ids = get_posts( [
            'post_type'      => 'asevj_style',
            'post_status'    => 'publish',
            'posts_per_page' => -1,
            'fields'         => 'ids',
            'meta_key'       => '_asevj_school_id',
            'meta_value'     => $school_id,
            'orderby'        => [ 'menu_order' => 'ASC', 'title' => 'ASC' ],
            'order'          => 'ASC',
        ] );

        $styles = [];
        foreach ( $style_ids as $candidate_id ) {
            $candidate_id = absint( $candidate_id );
            $product_id = absint( get_post_meta( $candidate_id, '_asevj_woo_product_id', true ) );
            if ( ! $product_id || 'product' !== get_post_type( $product_id ) || 'publish' !== get_post_status( $product_id ) ) {
                continue;
            }

            $url = get_permalink( $product_id );
            if ( ! $url ) {
                continue;
            }

            $styles[] = [
                'id'      => $candidate_id,
                'name'    => get_the_title( $candidate_id ),
                'url'     => $url,
                'current' => $candidate_id === $current_style_id,
            ];
        }

        return $styles;
    }

'''
          if 'private static function same_school_styles' not in p:
              if helper_anchor not in p:
                  raise SystemExit('render() anchor not found')
              p = p.replace(helper_anchor, helper + helper_anchor, 1)

          if '$same_school_styles = self::same_school_styles' not in p:
              p = p.replace(
                  "        $price_html = self::price_html( $style_id, $product );\n",
                  "        $price_html = self::price_html( $style_id, $product );\n        $same_school_styles = self::same_school_styles( $school_id, $style_id );\n",
                  1
              )

          if '$style_switcher_label =' not in p:
              p = p.replace(
                  "        $price_label = sanitize_text_field( (string) ( $attributes['priceLabel'] ?? 'STARTING AT' ) );\n",
                  "        $price_label = sanitize_text_field( (string) ( $attributes['priceLabel'] ?? 'STARTING AT' ) );\n        $style_switcher_label = sanitize_text_field( (string) ( $attributes['styleSwitcherLabel'] ?? 'JACKET STYLES' ) );\n",
                  1
              )

          if '$show_style_switcher =' not in p:
              p = p.replace(
                  "        $show_school_meta = ! array_key_exists( 'showSchoolMeta', $attributes ) || ! empty( $attributes['showSchoolMeta'] );\n",
                  "        $show_school_meta = ! array_key_exists( 'showSchoolMeta', $attributes ) || ! empty( $attributes['showSchoolMeta'] );\n        $show_style_switcher = ! array_key_exists( 'showStyleSwitcher', $attributes ) || ! empty( $attributes['showStyleSwitcher'] );\n",
                  1
              )

          old_identity = "                            <div><small><?php echo esc_html( $school_name ); ?></small><h1><?php echo esc_html( $style_name ); ?></h1></div>\n"
          new_identity = "                            <div><h1><?php echo esc_html( $school_name ); ?></h1><p class=\"asevj-vjpp__style-name\"><?php echo esc_html( $style_name ); ?></p></div>\n"
          if old_identity in p:
              p = p.replace(old_identity, new_identity, 1)
          elif 'asevj-vjpp__style-name' not in p:
              raise SystemExit('School/style identity markup not found')

          switcher_anchor = "                        <?php if ( $price_html ) : ?>\n"
          switcher_markup = r'''                        <?php if ( $show_style_switcher && count( $same_school_styles ) > 1 ) : ?>
                            <nav class="asevj-vjpp__style-switcher" aria-label="Other jacket styles for <?php echo esc_attr( $school_name ); ?>">
                                <span class="asevj-vjpp__style-switcher-label"><?php echo esc_html( $style_switcher_label ); ?></span>
                                <div class="asevj-vjpp__style-switcher-links">
                                    <?php foreach ( $same_school_styles as $school_style ) : ?>
                                        <?php if ( ! empty( $school_style['current'] ) ) : ?>
                                            <span class="asevj-vjpp__style-choice is-active" aria-current="page"><?php echo esc_html( $school_style['name'] ); ?></span>
                                        <?php else : ?>
                                            <a class="asevj-vjpp__style-choice" href="<?php echo esc_url( $school_style['url'] ); ?>"><?php echo esc_html( $school_style['name'] ); ?></a>
                                        <?php endif; ?>
                                    <?php endforeach; ?>
                                </div>
                            </nav>
                        <?php endif; ?>

'''
          if 'asevj-vjpp__style-switcher' not in p:
              if switcher_anchor not in p:
                  raise SystemExit('Price markup anchor not found')
              p = p.replace(switcher_anchor, switcher_markup + switcher_anchor, 1)

          product.write_text(p, encoding='utf-8')

          # Changelog/readme.
          changelog = root / 'CHANGELOG.md'
          old = changelog.read_text(encoding='utf-8')
          if not old.startswith('## 1.0.14'):
              entry = '''## 1.0.14\n\n- Made the school name the primary product-page heading and moved the jacket style name to a smaller subtitle.\n- Added an automatic same-school Jacket Styles switcher below mascot/location metadata when multiple linked styles exist.\n- Current style is clearly marked; alternate styles link directly to their dedicated varsity product pages.\n- Added block controls for the style-switcher label and visibility.\n\n'''
              changelog.write_text(entry + old, encoding='utf-8')

          readme = root / 'readme.txt'
          if readme.exists():
              rt = readme.read_text(encoding='utf-8')
              rt = re.sub(r'Stable tag:\s*[^\n]+', 'Stable tag: 1.0.14', rt)
              if '= 1.0.14 =' not in rt:
                  rt += '''\n= 1.0.14 =\n* School name is now the primary product heading with the style as a subtitle.\n* Adds a same-school jacket style switcher to linked product pages.\n'''
              readme.write_text(rt, encoding='utf-8')
          PY

      - name: Add product identity CSS
        shell: bash
        run: |
          cat > all-star-varsity-jackets/blocks/product-page/identity.css <<'CSS'
          /* v1.0.14 — school-first product identity + same-school style switcher */
          .asevj-vjpp__school h1{
              margin:0;
              font-family:var(--asevj-heading-font,inherit);
              font-size:clamp(38px,4.1vw,64px);
              line-height:.94;
              font-weight:900;
              letter-spacing:.005em;
              color:var(--asevj-vjpp-navy,#101B31);
              text-transform:uppercase;
              overflow-wrap:anywhere;
          }
          .asevj-vjpp__style-name{
              margin:8px 0 0;
              font-family:var(--asevj-heading-font,inherit);
              font-size:clamp(16px,1.45vw,22px);
              line-height:1.15;
              font-weight:750;
              color:var(--asevj-vjpp-muted,#687385);
          }
          .asevj-vjpp__style-switcher{
              margin:16px 0 0;
              padding:14px 0 0;
              border-top:1px solid #e2e6eb;
          }
          .asevj-vjpp__style-switcher-label{
              display:block;
              margin-bottom:8px;
              font-size:9px;
              line-height:1;
              font-weight:900;
              letter-spacing:.12em;
              color:var(--asevj-vjpp-muted,#687385);
              text-transform:uppercase;
          }
          .asevj-vjpp__style-switcher-links{
              display:flex;
              flex-wrap:wrap;
              gap:7px;
          }
          .asevj-vjpp__style-choice{
              min-height:34px;
              display:inline-flex;
              align-items:center;
              justify-content:center;
              padding:7px 11px;
              border:1px solid #cfd5dd;
              border-radius:3px;
              background:transparent;
              color:var(--asevj-vjpp-navy,#101B31)!important;
              font-size:10px;
              line-height:1.15;
              font-weight:850;
              text-decoration:none!important;
              transition:border-color .15s ease,background-color .15s ease;
          }
          a.asevj-vjpp__style-choice:hover{
              border-color:var(--asevj-vjpp-navy,#101B31);
              background:color-mix(in srgb,var(--asevj-vjpp-navy,#101B31) 4%,transparent);
          }
          .asevj-vjpp__style-choice.is-active{
              border-color:var(--asevj-vjpp-accent,#F2B619);
              background:var(--asevj-vjpp-accent,#F2B619);
              cursor:default;
          }
          @media(max-width:560px){
              .asevj-vjpp__school h1{font-size:clamp(32px,10vw,46px)}
              .asevj-vjpp__style-name{font-size:16px}
              .asevj-vjpp__style-switcher-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
              .asevj-vjpp__style-choice{width:100%;text-align:center}
          }
          CSS

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ \* Version: 1.0.14$' all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q "define( 'ASEVJ_VERSION', '1.0.14' );" all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q 'same_school_styles' all-star-varsity-jackets/includes/class-asevj-product-page.php
          grep -q 'asevj-vjpp__style-switcher' all-star-varsity-jackets/includes/class-asevj-product-page.php
          grep -q 'asevj-vjpp__style-name' all-star-varsity-jackets/includes/class-asevj-product-page.php
          grep -q 'school-first product identity' all-star-varsity-jackets/blocks/product-page/identity.css
          python3 - <<'PY'
          import json
          p='all-star-varsity-jackets/blocks/product-page/block.json'
          data=json.load(open(p))
          assert data['version']=='1.0.14'
          assert data['attributes']['showStyleSwitcher']['default'] is True
          assert data['attributes']['styleSwitcherLabel']['default']=='JACKET STYLES'
          assert 'file:./identity.css' in data['style']
          PY
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do python3 -m json.tool "$file" >/dev/null; done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-varsity-jackets
          git commit -m 'release: school-first product identity in 1.0.14' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asevj114 all-star-varsity-jackets-1.0.14.zip
          mkdir -p /tmp/asevj114/all-star-varsity-jackets
          cp -R all-star-varsity-jackets/. /tmp/asevj114/all-star-varsity-jackets/
          cd /tmp/asevj114
          zip -qr "$GITHUB_WORKSPACE/all-star-varsity-jackets-1.0.14.zip" all-star-varsity-jackets
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-varsity-jackets-1.0.14.zip >/dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create v1.0.14 all-star-varsity-jackets-1.0.14.zip --target main --title 'All Star Varsity Jackets v1.0.14' --notes-file releases/RELEASE-1.0.14.md --latest

      - name: Update manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          url = 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.14/all-star-varsity-jackets-1.0.14.zip'
          homepage = 'https://github.com/All-Star-Embroidery/varsity-jackets'
          latest = {
              'name':'All Star Varsity Jackets','slug':'all-star-varsity-jackets','version':'1.0.14','download_url':url,
              'homepage':homepage,'requires':'6.4','tested':'6.8','requires_php':'8.0','last_updated':now,
              'description':"All Star Embroidery's WordPress/WooCommerce varsity jacket system with theme-compatible dedicated jacket product pages, school browsing, galleries, imports, and WooCommerce product tools.",
              'changelog':'<h4>1.0.14</h4><ul><li>Makes the school name the primary product-page heading.</li><li>Moves the jacket style name into a smaller subtitle.</li><li>Adds a same-school jacket style switcher below mascot/location details.</li></ul>'
          }
          Path('latest.json').write_text(json.dumps(latest, indent=2)+'\n', encoding='utf-8')
          Path('update.json').write_text(json.dumps({'version':'1.0.14','name':'All Star Varsity Jackets 1.0.14','prerelease':False,'package':url,'html_url':homepage,'published_at':now,'body':'School-first product identity and same-school style switching.'}, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json update.json
          git commit -m 'release: point updater to 1.0.14'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --location --retry 5 --retry-delay 2 "https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?run=${GITHUB_RUN_ID}" -o /tmp/latest.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/latest.json'))
          assert data['version']=='1.0.14', data
          PY
          curl --fail --location --retry 5 --retry-delay 2 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.14/all-star-varsity-jackets-1.0.14.zip' -o /tmp/asevj114.zip
          unzip -t /tmp/asevj114.zip >/dev/null
