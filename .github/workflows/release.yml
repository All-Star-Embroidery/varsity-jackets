name: Validate Varsity Jackets release

on:
  push:
    branches: [main]
    paths:
      - 'update.json'
      - 'releases/**'
      - 'packages/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ase-varsity-jackets-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct package from updater manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, hashlib, json, pathlib, urllib.parse

          root = pathlib.Path('.').resolve()
          manifest = json.loads(pathlib.Path('update.json').read_text())
          version = str(manifest['version']).lstrip('vV')
          package_type = str(manifest.get('package_type', 'zip'))
          out = pathlib.Path('/tmp/asevj-release.zip')

          if package_type == 'chunks':
              chunks = manifest.get('chunks') or []
              if not chunks:
                  raise SystemExit('Chunked manifest has no chunks.')
              encoded = ''
              for url in chunks:
                  parsed = urllib.parse.urlparse(str(url))
                  marker = '/rolejarczyk/ASE.VarsityJackets/main/'
                  if marker not in parsed.path:
                      raise SystemExit(f'Unexpected chunk URL: {url}')
                  rel = parsed.path.split(marker, 1)[1]
                  path = root / rel
                  if not path.is_file():
                      raise SystemExit(f'Chunk missing from repository: {rel}')
                  encoded += ''.join(path.read_text().split())
              out.write_bytes(base64.b64decode(encoded, validate=True))
          else:
              package = str(manifest['package'])
              filename = package.rsplit('/', 1)[-1]
              source = root / 'releases' / filename
              if not source.is_file():
                  raise SystemExit(f'Manifest package not found: {source}')
              out.write_bytes(source.read_bytes())

          expected = str(manifest.get('sha256', '')).lower().strip()
          actual = hashlib.sha256(out.read_bytes()).hexdigest()
          if expected and actual != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {actual}')

          print(f'version={version}')
          print(f'tag=v{version}')
          print('zip=/tmp/asevj-release.zip')
          print('prerelease=' + ('true' if manifest.get('prerelease') else 'false'))
          print(f'sha256={actual}')
          PY

      - name: Validate ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          unzip -t /tmp/asevj-release.zip
          rm -rf /tmp/asevj-unpacked
          mkdir -p /tmp/asevj-unpacked
          unzip -q /tmp/asevj-release.zip -d /tmp/asevj-unpacked
          test -f /tmp/asevj-unpacked/all-star-varsity-jackets/all-star-varsity-jackets.php

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find /tmp/asevj-unpacked/all-star-varsity-jackets -type f -name '*.php' -print0)

      - name: Validate block JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path('/tmp/asevj-unpacked/all-star-varsity-jackets/blocks').glob('*/block.json'):
              json.loads(path.read_text())
              print('OK', path)
          PY

      - name: Confirm package version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ steps.manifest.outputs.version }}'
          FILE='/tmp/asevj-unpacked/all-star-varsity-jackets/all-star-varsity-jackets.php'
          ACTUAL=$(sed -nE 's/^ \* Version: (.+)$/\1/p' "$FILE" | head -n1 | tr -d '\r')
          test "$ACTUAL" = "$EXPECTED" || { echo "Manifest says $EXPECTED but package says $ACTUAL" >&2; exit 1; }

      - name: Create or refresh formal GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          PRERELEASE: ${{ steps.manifest.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.manifest.outputs.version }}'
          ASSET="all-star-varsity-jackets-${VERSION}.zip"
          cp /tmp/asevj-release.zip "$ASSET"
          python - <<'PY' > /tmp/release-notes.md
          import json
          m = json.load(open('update.json'))
          print(f"## {m.get('name', m['version'])}")
          print()
          print(m.get('body', 'Automated All Star Varsity Jackets release.'))
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            EXTRA=()
            if [ "$PRERELEASE" = 'true' ]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "$TAG" --notes-file /tmp/release-notes.md "${EXTRA[@]}"
          fi
