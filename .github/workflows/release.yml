name: Validate and publish Varsity Jackets release

on:
  push:
    branches: [main]
    paths:
      - 'update.json'
      - 'releases/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ase-varsity-jackets-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read update manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          m = json.loads(Path('update.json').read_text())
          version = str(m['version']).lstrip('vV')
          package = str(m['package'])
          filename = package.rsplit('/', 1)[-1]
          path = Path('releases') / filename
          if not path.is_file():
              raise SystemExit(f'Manifest package not found in repository: {path}')
          print(f'version={version}')
          print(f'tag=v{version}')
          print(f'zip={path}')
          print('prerelease=' + ('true' if m.get('prerelease') else 'false'))
          PY

      - name: Validate ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          ZIP='${{ steps.manifest.outputs.zip }}'
          unzip -t "$ZIP"
          rm -rf /tmp/asevj-release
          mkdir -p /tmp/asevj-release
          unzip -q "$ZIP" -d /tmp/asevj-release
          test -f /tmp/asevj-release/all-star-varsity-jackets/all-star-varsity-jackets.php

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find /tmp/asevj-release/all-star-varsity-jackets -type f -name '*.php' -print0)

      - name: Validate block JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('/tmp/asevj-release/all-star-varsity-jackets/blocks')
          for path in root.glob('*/block.json'):
              json.loads(path.read_text())
              print('OK', path)
          PY

      - name: Confirm package version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ steps.manifest.outputs.version }}'
          FILE='/tmp/asevj-release/all-star-varsity-jackets/all-star-varsity-jackets.php'
          ACTUAL=$(sed -nE 's/^ \* Version: (.+)$/\1/p' "$FILE" | head -n1 | tr -d '\r')
          test "$ACTUAL" = "$EXPECTED" || { echo "Manifest says $EXPECTED but package says $ACTUAL" >&2; exit 1; }

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > RELEASE_NOTES.md
          import json
          from pathlib import Path
          m = json.loads(Path('update.json').read_text())
          print(f"## {m.get('name', m['version'])}")
          print()
          print(m.get('body', 'Automated All Star Varsity Jackets release.'))
          print()
          print('WordPress installations can receive this build through the plugin’s GitHub updater.')
          PY

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          ZIP: ${{ steps.manifest.outputs.zip }}
          PRERELEASE: ${{ steps.manifest.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            EXTRA=()
            if [ "$PRERELEASE" = 'true' ]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              "${EXTRA[@]}"
          fi
