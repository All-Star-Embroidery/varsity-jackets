name: Publish 1.0.13 Responsive Medium Gallery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.13.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Finalize 1.0.13 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('all-star-varsity-jackets')
          for p in (root / 'blocks').glob('*/block.json'):
              data = json.loads(p.read_text(encoding='utf-8'))
              data['version'] = '1.0.13'
              p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          changelog = root / 'CHANGELOG.md'
          old = changelog.read_text(encoding='utf-8')
          if not old.startswith('## 1.0.13'):
              entry = '''## 1.0.13\n\n- Kept product-page jacket photography in Scale to fit mode while capping it to a responsive medium size.\n- Added viewport-aware maximum image heights for desktop, tablet, mobile, and short laptop windows.\n- Preserved full-image visibility with no cropping and no fixed gallery-height controls.\n- Kept the Jacket Image Size control for optional further reduction.\n\n'''
              changelog.write_text(entry + old, encoding='utf-8')
          readme = root / 'readme.txt'
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              text = re.sub(r'Stable tag:\s*[^\n]+', 'Stable tag: 1.0.13', text)
              if '= 1.0.13 =' not in text:
                  text += '\n= 1.0.13 =\n* Keeps full jacket images visible while capping the product gallery to a responsive medium viewport size.\n'
              readme.write_text(text, encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ \* Version: 1.0.13$' all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q "define( 'ASEVJ_VERSION', '1.0.13' );" all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q 'responsive medium scale-to-fit product gallery' all-star-varsity-jackets/blocks/product-page/fit.css
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do python3 -m json.tool "$file" >/dev/null; done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-varsity-jackets
          git commit -m 'release: finalize 1.0.13 source' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asevj113 all-star-varsity-jackets-1.0.13.zip
          mkdir -p /tmp/asevj113/all-star-varsity-jackets
          cp -R all-star-varsity-jackets/. /tmp/asevj113/all-star-varsity-jackets/
          cd /tmp/asevj113
          zip -qr "$GITHUB_WORKSPACE/all-star-varsity-jackets-1.0.13.zip" all-star-varsity-jackets
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-varsity-jackets-1.0.13.zip >/dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create v1.0.13 all-star-varsity-jackets-1.0.13.zip --target main --title 'All Star Varsity Jackets v1.0.13' --notes-file releases/RELEASE-1.0.13.md --latest

      - name: Update manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          url = 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.13/all-star-varsity-jackets-1.0.13.zip'
          homepage = 'https://github.com/All-Star-Embroidery/varsity-jackets'
          latest = {
              'name':'All Star Varsity Jackets','slug':'all-star-varsity-jackets','version':'1.0.13','download_url':url,
              'homepage':homepage,'requires':'6.4','tested':'6.8','requires_php':'8.0','last_updated':now,
              'description':"All Star Embroidery's WordPress/WooCommerce varsity jacket system with theme-compatible dedicated jacket product pages, school browsing, galleries, imports, and WooCommerce product tools.",
              'changelog':'<h4>1.0.13</h4><ul><li>Keeps the entire jacket visible while limiting the main product image to a responsive medium size.</li><li>Uses viewport-aware caps on desktop, tablet, mobile, and short screens.</li><li>Reduces unnecessary scrolling without returning to fixed gallery-height controls.</li></ul>'
          }
          Path('latest.json').write_text(json.dumps(latest, indent=2)+'\n', encoding='utf-8')
          Path('update.json').write_text(json.dumps({'version':'1.0.13','name':'All Star Varsity Jackets 1.0.13','prerelease':False,'package':url,'html_url':homepage,'published_at':now,'body':'Responsive medium scale-to-fit product gallery.'}, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json update.json
          git commit -m 'release: point updater to 1.0.13'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --location --retry 5 --retry-delay 2 "https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?run=${GITHUB_RUN_ID}" -o /tmp/latest.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/latest.json'))
          assert data['version']=='1.0.13', data
          PY
          curl --fail --location --retry 5 --retry-delay 2 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.13/all-star-varsity-jackets-1.0.13.zip' -o /tmp/asevj113.zip
          unzip -t /tmp/asevj113.zip >/dev/null
