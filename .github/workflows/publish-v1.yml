name: Publish All Star Varsity Jackets v1.0.0

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: asevj-v1-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine release state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          MAIN='all-star-varsity-jackets/all-star-varsity-jackets.php'
          if grep -q 'Version: 1.0.0' "$MAIN"; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
            echo 'Source is already v1.0.0.'
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
            grep -q 'Version: 0.2.0-beta.9' "$MAIN"
          fi

      - name: Apply beta.9 to beta.14
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap-beta14/beta9-to-beta14.diff.gz.b64
          base64 --decode bootstrap-beta14/beta9-to-beta14.diff.gz.b64 | gzip -d > /tmp/beta14.patch
          patch -p1 < /tmp/beta14.patch
          grep -q 'Version: 0.2.0-beta.14' all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q "define( 'ASEVJ_VERSION', '0.2.0-beta.14' );" all-star-varsity-jackets/all-star-varsity-jackets.php

      - name: Apply beta.14 to beta.15
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap-v1/beta14-beta15.bz2.b64
          base64 --decode bootstrap-v1/beta14-beta15.bz2.b64 | bzip2 -d > /tmp/beta15.patch
          patch -p1 < /tmp/beta15.patch
          grep -q 'Version: 0.2.0-beta.15' all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q "define( 'ASEVJ_VERSION', '0.2.0-beta.15' );" all-star-varsity-jackets/all-star-varsity-jackets.php

      - name: Apply beta.15 to v1.0.0
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap-v1/beta15-v1-part-001.bz2.b64
          test -f bootstrap-v1/beta15-v1-part-002.bz2.b64
          cat bootstrap-v1/beta15-v1-part-*.bz2.b64 | base64 --decode | bzip2 -d > /tmp/v1.patch
          patch -p1 < /tmp/v1.patch
          grep -q 'Version: 1.0.0' all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q "define( 'ASEVJ_VERSION', '1.0.0' );" all-star-varsity-jackets/all-star-varsity-jackets.php

      - name: Validate production source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)

          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

          grep -q 'Version: 1.0.0' all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q "define( 'ASEVJ_VERSION', '1.0.0' );" all-star-varsity-jackets/all-star-varsity-jackets.php

      - name: Create v1.0.0 release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cat > releases/RELEASE-1.0.0.md <<'EOF'
          # All Star Varsity Jackets 1.0.0

          ## Changes
          - First production release of All Star Varsity Jackets.
          - Rebuilt the mobile hero as an intentional responsive layout with dedicated mobile title, padding, feature, jacket scale, visual height, and X/Y positioning controls.
          - Prevented mobile jacket cropping and oversized hero typography while preserving desktop/tablet positioning controls.
          - Browse by School now opens on Newark when available, with a safe fallback to the first enabled school.
          - Moved the “Slide to find your school” hint below the school selector, improved contrast, and retained automatic dismissal after interaction.
          - Refined Available Customizations on mobile with better horizontal spacing and consistent typography.
          - Includes the gallery-first Browse by School experience with selectable multiple jacket styles and full Front/Back/Letter/Sleeve/Detail galleries.
          - Includes structured ZIP/CSV school imports, school logos, mascot artwork, multi-style folders, and importer reliability fixes.
          - Includes School and Jacket Style editor save/redirect fixes and the final responsive storefront sweep.
          - Includes GitHub-powered WordPress updates with Release asset support and checksum-verified direct package transport for future releases.
          EOF

      - name: Build WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='1.0.0'
          BUILD='/tmp/asevj-v1-build'
          ZIP="$GITHUB_WORKSPACE/all-star-varsity-jackets-${VERSION}.zip"

          rm -rf "$BUILD" "$ZIP"
          mkdir -p "$BUILD/all-star-varsity-jackets"
          cp -R all-star-varsity-jackets/. "$BUILD/all-star-varsity-jackets/"
          rm -rf "$BUILD/all-star-varsity-jackets/.git"
          rm -rf "$BUILD/all-star-varsity-jackets/.github"
          rm -rf "$BUILD/all-star-varsity-jackets/tests"
          rm -rf "$BUILD/all-star-varsity-jackets/node_modules"

          cd "$BUILD"
          zip -qr "$ZIP" all-star-varsity-jackets
          unzip -t "$ZIP" >/dev/null

          TOP_LEVEL=$(zipinfo -1 "$ZIP" | awk -F/ 'NF {print $1}' | sort -u)
          test "$TOP_LEVEL" = 'all-star-varsity-jackets' || {
            echo "Unexpected ZIP root(s): $TOP_LEVEL" >&2
            exit 1
          }
          zipinfo -1 "$ZIP" | grep -q '^all-star-varsity-jackets/all-star-varsity-jackets.php$'

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='1.0.0'
          TAG='asevj-v1.0.0'
          ZIP="all-star-varsity-jackets-${VERSION}.zip"
          NOTES="releases/RELEASE-${VERSION}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "All Star Varsity Jackets v${VERSION}" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "$ZIP" \
              --target main \
              --title "All Star Varsity Jackets v${VERSION}" \
              --notes-file "$NOTES" \
              --latest
          fi

          EXPECTED="https://github.com/rolejarczyk/ASE.VarsityJackets/releases/download/${TAG}/${ZIP}"
          rm -f /tmp/asevj-v1-release-verify.zip
          curl --fail --location --retry 4 --retry-delay 2 "$EXPECTED" -o /tmp/asevj-v1-release-verify.zip
          unzip -t /tmp/asevj-v1-release-verify.zip >/dev/null
          zipinfo -1 /tmp/asevj-v1-release-verify.zip | grep -q '^all-star-varsity-jackets/all-star-varsity-jackets.php$'
          echo "Verified release asset: $EXPECTED"

      - name: Update WordPress updater manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import json
          from datetime import datetime, timezone

          version = '1.0.0'
          tag = 'asevj-v1.0.0'
          zip_name = 'all-star-varsity-jackets-1.0.0.zip'
          download_url = f'https://github.com/rolejarczyk/ASE.VarsityJackets/releases/download/{tag}/{zip_name}'
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')

          changes = [
              'First production release of All Star Varsity Jackets.',
              'Mobile-first hero layout with dedicated mobile controls and no jacket cropping.',
              'Newark selected by default in Browse by School.',
              'School carousel hint moved below the selector, made clearer, and dismissed after interaction.',
              'Available Customizations mobile spacing and typography refined.',
              'Gallery-first multiple-style school browsing and full jacket galleries.',
              'Structured school/style imports, editor-saving fixes, and final responsive storefront polish.',
              'GitHub-powered updater retained for future WordPress releases.',
          ]
          changelog = '<h4>1.0.0</h4><ul>' + ''.join(f'<li>{html.escape(x)}</li>' for x in changes) + '</ul>'

          latest = {
              'name': 'All Star Varsity Jackets',
              'slug': 'all-star-varsity-jackets',
              'version': version,
              'download_url': download_url,
              'homepage': 'https://github.com/rolejarczyk/ASE.VarsityJackets',
              'requires': '6.4',
              'tested': '6.8',
              'requires_php': '8.0',
              'last_updated': now,
              'description': 'School-based varsity jacket collections with structured school imports, live Gutenberg blocks, gallery management, optional WooCommerce products, and responsive storefront tools for All Star Embroidery.',
              'changelog': changelog,
          }
          legacy = {
              'version': version,
              'name': 'All Star Varsity Jackets 1.0.0',
              'prerelease': False,
              'package': download_url,
              'html_url': 'https://github.com/rolejarczyk/ASE.VarsityJackets',
              'published_at': now,
              'body': 'Production release.',
          }

          with open('latest.json', 'w', encoding='utf-8') as f:
              f.write(json.dumps(latest, indent=2) + '\n')
          with open('update.json', 'w', encoding='utf-8') as f:
              f.write(json.dumps(legacy, indent=2) + '\n')
          PY

      - name: Commit production source and cleanup one-time bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap-v1
          rm -rf bootstrap-beta14
          rm -rf packages/0.2.0-beta.15
          rm -f .github/workflows/apply-beta10-style-folders.yml
          rm -f .github/workflows/apply-beta14.yml
          rm -f .github/workflows/publish-v1.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: All Star Varsity Jackets 1.0.0' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify public updater manifest
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='https://github.com/rolejarczyk/ASE.VarsityJackets/releases/download/asevj-v1.0.0/all-star-varsity-jackets-1.0.0.zip'
          sleep 4
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://raw.githubusercontent.com/rolejarczyk/ASE.VarsityJackets/main/latest.json?run=${GITHUB_RUN_ID}" \
            -o /tmp/asevj-v1-latest.json
          python3 - <<PY
          import json
          data = json.load(open('/tmp/asevj-v1-latest.json'))
          assert data['version'] == '1.0.0', data
          assert data['download_url'] == "$EXPECTED", data
          assert '/releases/download/' in data['download_url'], data
          print('V1 AUTO-UPDATE MANIFEST VERIFIED:', data['version'], data['download_url'])
          PY
