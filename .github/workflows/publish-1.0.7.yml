name: Publish 1.0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.7.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply compact gallery update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('all-star-varsity-jackets')

          main = root / 'all-star-varsity-jackets.php'
          s = main.read_text(encoding='utf-8')
          s = s.replace('Version: 1.0.6', 'Version: 1.0.7')
          s = s.replace("define( 'ASEVJ_VERSION', '1.0.6' );", "define( 'ASEVJ_VERSION', '1.0.7' );")
          main.write_text(s, encoding='utf-8')

          for block_json in (root / 'blocks').glob('*/block.json'):
              data = json.loads(block_json.read_text(encoding='utf-8'))
              data['version'] = '1.0.7'
              block_json.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          css = root / 'assets/frontend.css'
          c = css.read_text(encoding='utf-8')
          c += r'''

/* v1.0.7 — slightly smaller inline Browse by School gallery */
.asevj-style-showcase [data-asevj-selected-gallery]{
    max-width:100%;
}
.asevj-style-showcase .asevj-selected-gallery{
    min-height:0;
}
.asevj-style-showcase .asevj-gallery-tile{
    min-height:0;
    height:clamp(118px,10.5vw,164px);
}
.asevj-style-showcase .asevj-gallery-tile.is-main{
    height:clamp(270px,27vw,365px);
}
.asevj-style-showcase .asevj-gallery-tile img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
}

@media (max-width:1180px){
    .asevj-style-showcase .asevj-gallery-tile{
        height:clamp(110px,12vw,150px);
    }
    .asevj-style-showcase .asevj-gallery-tile.is-main{
        height:clamp(245px,31vw,330px);
    }
}

@media (max-width:760px){
    .asevj-style-showcase .asevj-gallery-tile{
        height:clamp(105px,30vw,145px);
    }
    .asevj-style-showcase .asevj-gallery-tile.is-main{
        height:clamp(230px,68vw,315px);
    }
}
'''
          css.write_text(c, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          entry = '''## 1.0.7\n\n- Reduced the inline Browse by School gallery height to keep more of the selector in one viewport.\n- Slightly reduced supporting gallery tiles while preserving image containment.\n- Added responsive gallery caps for laptop, tablet, and mobile widths.\n- Left the jacket-detail popup sizing unchanged.\n\n'''
          changelog.write_text(entry + changelog.read_text(encoding='utf-8'), encoding='utf-8')

          readme = root / 'readme.txt'
          rt = readme.read_text(encoding='utf-8')
          rt = re.sub(r'Stable tag:\s*[^\n]+', 'Stable tag: 1.0.7', rt)
          rt += '''\n= 1.0.7 =\n* Reduced Browse by School gallery height to minimize scrolling.\n* Preserved uncropped jacket images with responsive sizing.\n'''
          readme.write_text(rt, encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ \* Version: 1.0.7$' all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q "define( 'ASEVJ_VERSION', '1.0.7' );" all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q 'v1.0.7 — slightly smaller inline Browse by School gallery' all-star-varsity-jackets/assets/frontend.css
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do python3 -m json.tool "$file" >/dev/null; done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-varsity-jackets
          git commit -m 'release: compact inline gallery in 1.0.7' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asevj-1.0.7-build all-star-varsity-jackets-1.0.7.zip
          mkdir -p /tmp/asevj-1.0.7-build/all-star-varsity-jackets
          cp -R all-star-varsity-jackets/. /tmp/asevj-1.0.7-build/all-star-varsity-jackets/
          cd /tmp/asevj-1.0.7-build
          zip -qr "$GITHUB_WORKSPACE/all-star-varsity-jackets-1.0.7.zip" all-star-varsity-jackets
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-varsity-jackets-1.0.7.zip >/dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.7 all-star-varsity-jackets-1.0.7.zip --target main --title 'All Star Varsity Jackets v1.0.7' --notes-file releases/RELEASE-1.0.7.md --latest

      - name: Update manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          url = 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.7/all-star-varsity-jackets-1.0.7.zip'
          latest = {
              'name':'All Star Varsity Jackets','slug':'all-star-varsity-jackets','version':'1.0.7','download_url':url,
              'homepage':'https://github.com/All-Star-Embroidery/varsity-jackets','requires':'6.4','tested':'6.8','requires_php':'8.0','last_updated':now,
              'description':"All Star Embroidery's WordPress/WooCommerce varsity jacket system with school browsing, multiple jacket styles per school, responsive image galleries, structured ZIP/CSV imports, live Gutenberg blocks, WooCommerce product tools, and organization-owned automatic updates.",
              'changelog':'<h4>1.0.7</h4><ul><li>Reduced the inline Browse by School gallery height to minimize scrolling.</li><li>Preserved uncropped jacket photography with responsive contain sizing.</li><li>Added smaller laptop/tablet/mobile gallery heights while leaving the detail popup unchanged.</li></ul>'
          }
          Path('latest.json').write_text(json.dumps(latest, indent=2)+'\n', encoding='utf-8')
          Path('update.json').write_text(json.dumps(latest, indent=2)+'\n', encoding='utf-8')
          PY
          git add latest.json update.json
          git commit -m 'release: point manifests to 1.0.7'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?$(date +%s)" | grep -q '"version": "1.0.7"'
          curl -fsI -L 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.7/all-star-varsity-jackets-1.0.7.zip' >/dev/null
