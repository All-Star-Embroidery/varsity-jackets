name: Publish 1.0.10 Product Page Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.10.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply 1.0.10 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('all-star-varsity-jackets')

          main = root / 'all-star-varsity-jackets.php'
          s = main.read_text(encoding='utf-8')
          s = s.replace('Version: 1.0.9', 'Version: 1.0.10')
          s = s.replace("define( 'ASEVJ_VERSION', '1.0.9' );", "define( 'ASEVJ_VERSION', '1.0.10' );")
          main.write_text(s, encoding='utf-8')

          for block_json in (root / 'blocks').glob('*/block.json'):
              data = json.loads(block_json.read_text(encoding='utf-8'))
              data['version'] = '1.0.10'
              if data.get('name') == 'all-star-varsity-jackets/product-page':
                  data['attributes']['borderRadius']['default'] = 4
              block_json.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          editor = root / 'blocks/product-page/editor.js'
          e = editor.read_text(encoding='utf-8')
          e = e.replace("borderRadius: { type: 'number', default: 10 }", "borderRadius: { type: 'number', default: 4 }")
          e = e.replace("value: a.borderRadius || 10, min: 0, max: 36", "value: (typeof a.borderRadius === 'number' ? a.borderRadius : 4), min: 0, max: 4")
          e = e.replace("label: __('Jacket image scale', 'all-star-varsity-jackets'), value: a.imageScale || 100, min: 70, max: 125", "label: __('Jacket image size', 'all-star-varsity-jackets'), help: __('100% is the largest safe size and always keeps the full jacket visible.', 'all-star-varsity-jackets'), value: a.imageScale || 100, min: 70, max: 100")
          editor.write_text(e, encoding='utf-8')

          product = root / 'includes/class-asevj-product-page.php'
          p = product.read_text(encoding='utf-8')
          p = p.replace("$radius = min( 36, max( 0, absint( $attributes['borderRadius'] ?? 10 ) ) );", "$radius = min( 4, max( 0, absint( $attributes['borderRadius'] ?? 4 ) ) );")
          p = p.replace("$image_scale = min( 125, max( 70, absint( $attributes['imageScale'] ?? 100 ) ) );", "$image_scale = min( 100, max( 70, absint( $attributes['imageScale'] ?? 100 ) ) );")
          product.write_text(p, encoding='utf-8')

          css = root / 'blocks/product-page/style.css'
          c = css.read_text(encoding='utf-8')
          c += r'''

/* v1.0.10 — full-image safety + sharper retail/document visual language */
.asevj-vjpp__gallery,
.asevj-vjpp__info{
    border-color:#d8dde4;
    border-radius:var(--asevj-vjpp-radius,4px);
    box-shadow:none!important;
}
.asevj-vjpp__main-image{
    padding:clamp(8px,1vw,14px);
}
.asevj-vjpp__main-image img{
    width:100%!important;
    height:100%!important;
    max-width:100%!important;
    max-height:100%!important;
    object-fit:contain!important;
    object-position:center!important;
    transform:scale(calc(min(var(--asevj-vjpp-image-scale,100),100) / 100))!important;
}
.asevj-vjpp__thumb{
    border-radius:3px;
    box-shadow:none!important;
}
.asevj-vjpp__thumb.is-active{
    box-shadow:none!important;
    border-width:2px;
}
.asevj-vjpp__order{
    border-top:1px solid rgba(255,255,255,.18);
    box-shadow:none!important;
}
.asevj-vjpp__order a{
    border-radius:3px;
    box-shadow:none!important;
}
.asevj-vjpp__customization-grid,
.asevj-vjpp__process{
    border-radius:var(--asevj-vjpp-radius,4px);
    box-shadow:none!important;
}
.asevj-vjpp__customization-grid{
    border-color:#d8dde4;
}
.asevj-vjpp__price{
    box-shadow:none!important;
}
@media(max-width:820px){
    .asevj-vjpp__customization-grid{border-radius:4px}
}
'''
          css.write_text(c, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          old = changelog.read_text(encoding='utf-8')
          entry = '''## 1.0.10\n\n- Ensured the full jacket image always remains visible at every responsive size.\n- Capped jacket image scaling at 100% to prevent viewport cropping.\n- Sharpened the product-page design to 3–4px radii and removed soft SaaS-style shadows.\n- Replaced floating-card styling with hairline borders and flatter retail/document surfaces.\n\n## 1.0.9\n\n- Added automatic routing of linked varsity WooCommerce products to the dedicated jacket product template.\n- Added the editable shared Product Page Template.\n- Disabled online purchasing for linked varsity jacket products while leaving normal WooCommerce products unchanged.\n\n'''
          if not old.startswith('## 1.0.10'):
              changelog.write_text(entry + old, encoding='utf-8')

          readme = root / 'readme.txt'
          if readme.exists():
              rt = readme.read_text(encoding='utf-8')
              rt = re.sub(r'Stable tag:\s*[^\n]+', 'Stable tag: 1.0.10', rt)
              if '= 1.0.10 =' not in rt:
                  rt += '''\n= 1.0.10 =\n* Keeps the full jacket image visible across responsive sizes.\n* Sharpens the dedicated product-page visual system and removes soft card shadows.\n'''
              readme.write_text(rt, encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ \* Version: 1.0.10$' all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q "define( 'ASEVJ_VERSION', '1.0.10' );" all-star-varsity-jackets/all-star-varsity-jackets.php
          grep -q 'v1.0.10 — full-image safety' all-star-varsity-jackets/blocks/product-page/style.css
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do python3 -m json.tool "$file" >/dev/null; done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-varsity-jackets
          git commit -m 'release: polish jacket product page in 1.0.10' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asevj110 all-star-varsity-jackets-1.0.10.zip
          mkdir -p /tmp/asevj110/all-star-varsity-jackets
          cp -R all-star-varsity-jackets/. /tmp/asevj110/all-star-varsity-jackets/
          cd /tmp/asevj110
          zip -qr "$GITHUB_WORKSPACE/all-star-varsity-jackets-1.0.10.zip" all-star-varsity-jackets
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-varsity-jackets-1.0.10.zip >/dev/null

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create v1.0.10 all-star-varsity-jackets-1.0.10.zip --target main --title 'All Star Varsity Jackets v1.0.10' --notes-file releases/RELEASE-1.0.10.md --latest

      - name: Update WordPress manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          url = 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.10/all-star-varsity-jackets-1.0.10.zip'
          homepage = 'https://github.com/All-Star-Embroidery/varsity-jackets'
          latest = {
              'name':'All Star Varsity Jackets','slug':'all-star-varsity-jackets','version':'1.0.10','download_url':url,
              'homepage':homepage,'requires':'6.4','tested':'6.8','requires_php':'8.0','last_updated':now,
              'description':"All Star Embroidery's WordPress/WooCommerce varsity jacket system with dedicated jacket product pages, school browsing, galleries, imports, and WooCommerce product tools.",
              'changelog':'<h4>1.0.10</h4><ul><li>Keeps the entire jacket image visible across responsive sizes.</li><li>Sharpens product-page surfaces to 3–4px radii.</li><li>Removes soft card/button shadows in favor of hairline retail/document styling.</li></ul>'
          }
          Path('latest.json').write_text(json.dumps(latest, indent=2)+'\n', encoding='utf-8')
          Path('update.json').write_text(json.dumps({'version':'1.0.10','name':'All Star Varsity Jackets 1.0.10','prerelease':False,'package':url,'html_url':homepage,'published_at':now,'body':'Responsive full-image and product-page visual polish.'}, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json update.json
          git commit -m 'release: point updater to 1.0.10'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify public update channel
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --location --retry 5 --retry-delay 2 "https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?run=${GITHUB_RUN_ID}" -o /tmp/latest.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/latest.json'))
          assert data['version']=='1.0.10', data
          PY
          curl --fail --location --retry 5 --retry-delay 2 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.10/all-star-varsity-jackets-1.0.10.zip' -o /tmp/asevj110.zip
          unzip -t /tmp/asevj110.zip >/dev/null
