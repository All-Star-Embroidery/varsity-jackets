name: Publish 1.0.4 Organization Updater Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.4-migration.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate source version and update routing
        shell: bash
        run: |
          set -euo pipefail
          MAIN='all-star-varsity-jackets/all-star-varsity-jackets.php'
          grep -q '^ \* Version: 1.0.4$' "$MAIN"
          grep -q "define( 'ASEVJ_VERSION', '1.0.4' );" "$MAIN"
          grep -q 'Update URI: https://github.com/All-Star-Embroidery/varsity-jackets' "$MAIN"
          grep -q "RELEASE_REPO = 'All-Star-Embroidery/varsity-jackets'" all-star-varsity-jackets/includes/class-asevj-updater.php
          grep -q 'raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json' all-star-varsity-jackets/includes/class-asevj-updater.php
          test -f releases/RELEASE-1.0.4.md

          while IFS= read -r -d '' file; do php -l "$file"; done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do python3 -m json.tool "$file" >/dev/null; done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

      - name: Build and validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asevj-1.0.4-build all-star-varsity-jackets-1.0.4.zip
          mkdir -p /tmp/asevj-1.0.4-build/all-star-varsity-jackets
          cp -R all-star-varsity-jackets/. /tmp/asevj-1.0.4-build/all-star-varsity-jackets/
          rm -rf /tmp/asevj-1.0.4-build/all-star-varsity-jackets/.git /tmp/asevj-1.0.4-build/all-star-varsity-jackets/.github /tmp/asevj-1.0.4-build/all-star-varsity-jackets/tests /tmp/asevj-1.0.4-build/all-star-varsity-jackets/node_modules
          cd /tmp/asevj-1.0.4-build
          zip -qr "$GITHUB_WORKSPACE/all-star-varsity-jackets-1.0.4.zip" all-star-varsity-jackets
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-varsity-jackets-1.0.4.zip >/dev/null
          zipinfo -1 all-star-varsity-jackets-1.0.4.zip | grep -q '^all-star-varsity-jackets/all-star-varsity-jackets.php$'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.4 >/dev/null 2>&1; then
            gh release upload v1.0.4 all-star-varsity-jackets-1.0.4.zip --clobber
            gh release edit v1.0.4 --title 'All Star Varsity Jackets v1.0.4' --notes-file releases/RELEASE-1.0.4.md --latest
          else
            gh release create v1.0.4 all-star-varsity-jackets-1.0.4.zip --target main --title 'All Star Varsity Jackets v1.0.4' --notes-file releases/RELEASE-1.0.4.md --latest
          fi

      - name: Update WordPress manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          url = 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.4/all-star-varsity-jackets-1.0.4.zip'
          latest = {
              'name': 'All Star Varsity Jackets',
              'slug': 'all-star-varsity-jackets',
              'version': '1.0.4',
              'download_url': url,
              'homepage': 'https://github.com/All-Star-Embroidery/varsity-jackets',
              'requires': '6.4',
              'tested': '6.8',
              'requires_php': '8.0',
              'last_updated': now,
              'description': "All Star Embroidery's WordPress/WooCommerce varsity jacket system with school browsing, multiple jacket styles per school, responsive image galleries, structured ZIP/CSV imports, live Gutenberg blocks, WooCommerce product tools, and organization-owned automatic updates.",
              'changelog': '<h4>1.0.4</h4><ul><li>Moved the WordPress updater permanently to All-Star-Embroidery/varsity-jackets.</li><li>Clears pre-migration updater caches and refreshes the manifest namespace.</li><li>Keeps transitional compatibility with the former personal-repository release URL while all future updates come from the organization repository.</li></ul>'
          }
          Path('latest.json').write_text(json.dumps(latest, indent=2) + '\n', encoding='utf-8')

          legacy = {
              'version': '1.0.4',
              'name': 'All Star Varsity Jackets 1.0.4',
              'prerelease': False,
              'package': url,
              'html_url': 'https://github.com/All-Star-Embroidery/varsity-jackets',
              'published_at': now,
              'body': 'Organization updater migration bridge. All future releases are published from All-Star-Embroidery/varsity-jackets.'
          }
          Path('update.json').write_text(json.dumps(legacy, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json update.json
          git commit -m 'release: point WordPress updater to 1.0.4' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify public organization update channel
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --location --retry 5 --retry-delay 2 'https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?bridge=104' -o /tmp/latest.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/latest.json'))
          assert data['version'] == '1.0.4', data
          assert data['homepage'] == 'https://github.com/All-Star-Embroidery/varsity-jackets', data
          assert data['download_url'] == 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.4/all-star-varsity-jackets-1.0.4.zip', data
          print('Verified organization updater:', data['download_url'])
          PY

          curl --fail --location --retry 5 --retry-delay 2 'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/v1.0.4/all-star-varsity-jackets-1.0.4.zip' -o /tmp/asevj-1.0.4.zip
          unzip -t /tmp/asevj-1.0.4.zip >/dev/null
          unzip -p /tmp/asevj-1.0.4.zip all-star-varsity-jackets/includes/class-asevj-updater.php | grep -q 'All-Star-Embroidery/varsity-jackets'
