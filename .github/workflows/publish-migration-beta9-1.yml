name: Publish Varsity migration beta.9.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-migration-beta9-1.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: ase-varsity-jackets-publish
  cancel-in-progress: false

jobs:
  publish-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate migration source
        shell: bash
        run: |
          set -euo pipefail
          MAIN='all-star-varsity-jackets/all-star-varsity-jackets.php'
          grep -q 'Version: 0.2.0-beta.9.1' "$MAIN"
          grep -q "define( 'ASEVJ_VERSION', '0.2.0-beta.9.1' );" "$MAIN"
          grep -q 'All-Star-Embroidery/varsity-jackets' "$MAIN"
          test -f releases/RELEASE-0.2.0-beta.9.1.md

          while IFS= read -r -d '' file; do php -l "$file"; done < <(find all-star-varsity-jackets -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find all-star-varsity-jackets -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do python3 -m json.tool "$file" >/dev/null; done < <(find all-star-varsity-jackets/blocks -type f -name 'block.json' -print0)

      - name: Build and validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.2.0-beta.9.1'
          BUILD='/tmp/asevj-migration-build'
          ZIP="$GITHUB_WORKSPACE/all-star-varsity-jackets-${VERSION}.zip"
          rm -rf "$BUILD" "$ZIP"
          mkdir -p "$BUILD/all-star-varsity-jackets"
          cp -R all-star-varsity-jackets/. "$BUILD/all-star-varsity-jackets/"
          rm -rf "$BUILD/all-star-varsity-jackets/.git" "$BUILD/all-star-varsity-jackets/.github" "$BUILD/all-star-varsity-jackets/tests" "$BUILD/all-star-varsity-jackets/node_modules"
          cd "$BUILD"
          zip -qr "$ZIP" all-star-varsity-jackets
          unzip -t "$ZIP" >/dev/null
          test "$(zipinfo -1 "$ZIP" | awk -F/ 'NF {print $1}' | sort -u)" = 'all-star-varsity-jackets'
          test "$(zipinfo -1 "$ZIP" | grep -c '^all-star-varsity-jackets/all-star-varsity-jackets.php$')" -eq 1

      - name: Publish organization Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.2.0-beta.9.1'
          TAG='asevj-v0.2.0-beta.9.1'
          ZIP="all-star-varsity-jackets-${VERSION}.zip"
          NOTES='releases/RELEASE-0.2.0-beta.9.1.md'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "All Star Varsity Jackets v${VERSION}" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" "$ZIP" --target main --title "All Star Varsity Jackets v${VERSION}" --notes-file "$NOTES" --prerelease
          fi

          EXPECTED="https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/${TAG}/${ZIP}"
          rm -f /tmp/asevj-migration-verify.zip
          curl --fail --location --retry 4 --retry-delay 2 "$EXPECTED" -o /tmp/asevj-migration-verify.zip
          unzip -t /tmp/asevj-migration-verify.zip >/dev/null
          zipinfo -1 /tmp/asevj-migration-verify.zip | grep -q '^all-star-varsity-jackets/all-star-varsity-jackets.php$'
          echo "Verified organization release asset: $EXPECTED"

      - name: Write organization WordPress manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          version = '0.2.0-beta.9.1'
          tag = 'asevj-v0.2.0-beta.9.1'
          zip_name = 'all-star-varsity-jackets-0.2.0-beta.9.1.zip'
          download = f'https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/{tag}/{zip_name}'
          homepage = 'https://github.com/All-Star-Embroidery/varsity-jackets'
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')

          notes = Path('releases/RELEASE-0.2.0-beta.9.1.md').read_text(encoding='utf-8')
          bullets = []
          in_changes = False
          for line in notes.splitlines():
              if line.strip().lower() == '## changes':
                  in_changes = True
                  continue
              if in_changes and line.startswith('## '):
                  break
              if in_changes and line.startswith('- '):
                  bullets.append(line[2:].strip())
          changelog = '<h4>0.2.0-beta.9.1</h4><ul>' + ''.join(f'<li>{html.escape(x)}</li>' for x in bullets) + '</ul>'

          latest = {
              'name': 'All Star Varsity Jackets',
              'slug': 'all-star-varsity-jackets',
              'version': version,
              'download_url': download,
              'homepage': homepage,
              'requires': '6.4',
              'tested': '6.8',
              'requires_php': '8.0',
              'last_updated': now,
              'description': 'School-based varsity jacket collections with structured school imports, live Gutenberg blocks, gallery management, and optional WooCommerce products for All Star Embroidery.',
              'changelog': changelog,
          }
          legacy = {
              'version': version,
              'name': 'All Star Varsity Jackets 0.2.0-beta.9.1',
              'prerelease': True,
              'package': download,
              'html_url': homepage,
              'published_at': now,
              'body': 'Organization migration compatibility release.',
          }
          Path('latest.json').write_text(json.dumps(latest, indent=2) + '\n', encoding='utf-8')
          Path('update.json').write_text(json.dumps(legacy, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit manifests and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-migration-beta9-1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json update.json .github/workflows/publish-migration-beta9-1.yml
          git commit -m 'release: publish Varsity organization migration beta.9.1'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify public organization manifest
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='https://github.com/All-Star-Embroidery/varsity-jackets/releases/download/asevj-v0.2.0-beta.9.1/all-star-varsity-jackets-0.2.0-beta.9.1.zip'
          sleep 4
          curl --fail --location --retry 5 --retry-delay 2 "https://raw.githubusercontent.com/All-Star-Embroidery/varsity-jackets/main/latest.json?run=${GITHUB_RUN_ID}" -o /tmp/latest.json
          python3 - <<PY
          import json
          data=json.load(open('/tmp/latest.json'))
          assert data['version']=='0.2.0-beta.9.1', data
          assert data['download_url']=="$EXPECTED", data
          assert data['homepage']=='https://github.com/All-Star-Embroidery/varsity-jackets', data
          print('ORG MIGRATION MANIFEST VERIFIED:', data['version'], data['download_url'])
          PY
